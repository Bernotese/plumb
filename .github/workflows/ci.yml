name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    name: Debian and Ubuntu guest tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-guest
        env:
          GUEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forced guest failure cleans up and stops the distro loop
        run: |
          log="$RUNNER_TEMP/guest-failure.log"
          if bash test/guest/run.sh -test.no-such-flag >"$log" 2>&1; then cat "$log"; exit 1; fi
          grep -q 'test.no-such-flag' "$log"
          if grep -q 'plumb-guest-ubuntu' "$log"; then exit 1; fi
          test -z "$(docker ps -aq --filter "name=$GUEST_RUN_ID")"
          test -z "$(docker images -q "plumb-guest-*-$GUEST_RUN_ID")"
        env:
          GUEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Interrupt guest run cleans up
        run: |
          set +e
          timeout --foreground --preserve-status -s INT -k 60 25 bash test/guest/run.sh
          status=$?
          set -e
          echo "interrupt exit status: $status"
          test "$status" -eq 130
          containers=$(docker ps -aq --filter "name=$GUEST_RUN_ID")
          images=$(docker images -q "plumb-guest-*-$GUEST_RUN_ID")
          echo "leftover containers: ${containers:-none}; images: ${images:-none}"
          test -z "$containers"
          test -z "$images"
          ! compgen -G '/tmp/tmp.*/guest.test' >/dev/null
        env:
          GUEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  firewall-lxd:
    name: Firewall in unprivileged LXC and VMs (Debian 13, Ubuntu 26.04)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up LXD
        run: |
          sudo snap install lxd --channel=6/stable || sudo snap refresh lxd --channel=6/stable
          sudo lxd waitready
          sudo lxd init --auto
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket
          # Docker on the runner drops forwarded packets of other bridges.
          if sudo iptables -L DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -j ACCEPT
          fi
      - run: make test-guest-lxd
        env:
          GUEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make lint
      - name: Known vulnerabilities (govulncheck)
        run: make vuln
      - run: make test
      - name: Race detector
        run: make test-race
      - run: make build
      - name: Binaries print a version
        run: |
          bin/plumb version
          bin/plumb-agent version
      - name: plumb embeds the UI and the agent
        run: make check-embed
      - name: Browser for the end-to-end test
        run: cd web && npx playwright install --with-deps chromium
      - name: End-to-end test (UI on the real API)
        run: make test-e2e
