              schema: { type: string }
              example: |
                kind: Export
                format: 1
                revision: 7
                exported_at: "2026-11-10T09:30:00Z"
                version: 0.2.0
                secrets: [app-db]
                ---
                kind: Block
                name: motd
                spec:
                  description: Message of the day.
                  params:
                    type: object
