    post:
      tags: [targets]
      operationId: updateTargetAgent
      summary: Propose an agent update
      description: |
        Creates a Plan of origin `agent_update` with one step `agent:binary` (risk `disruptive`, a
        service restart, D-257). The Plan changes no document; its approval commits no revision.
        A human session or an `apply` token approves it. The Run sends the `update` command with
        the SHA-256 of the agent binary that this controller serves (D-258). The step is `applied`
        when the agent says hello with that binary within 2 minutes, else `failed`; when the agent
        restored its old binary, the step output and `status.agent_reverted` say so.

        `system` makes the same Plan by itself when the agent of a Target says hello with other
        capabilities than the agent of this controller and the agent can update itself; at most
        one pending `agent_update` Plan per Target.

        409 `nothing-to-do` when `status.agent_update` is `none`. 422 when it is `manual` (the
        agent is older than slice 3 and needs the one-time install by hand, D-258) or `unknown`
        (the agent never said hello).
