openapi: 3.1.0
info:
  title: Plumb API
  version: 0.1.0
  summary: Public API of the Plumb controller.
  description: |
    The web UI, scripts and AI clients use only this API (ARCHITECTURE §4, D-023).

    Conventions:
    - JSON fields are `snake_case`. Times are UTC RFC 3339.
    - The API uses the same words and ids as the database and `internal/wire` (D-045).
      Revision, Plan, Run, Issue and comment ids are integers.
    - Document shapes (`Image`, `Block`, `Target`) are the JSON Schemas in
      `internal/state/schema`. This file refers to them and does not copy them (D-043).
    - A change is `{attr, from, to, risk}`: `from` is the guest now, `to` is the desired state.
      A missing value means "not there". A sensitive change is `{attr, sensitive, risk}`
      without values (D-047).
    - A principal is the string `user:<name>`, `token:<id>`, `agent:<target>` or `system`.
    - Errors are `application/problem+json` (RFC 9457) with a `urn:plumb:problem:<code>` type.
    - Lists return `{items, next}`. `next` is an opaque cursor; pass it as `cursor` to get the
      next page. `next` is `null` on the last page.
    - Every change goes through a Plan: propose (`POST /plans`), review, approve. Re-enroll,
      rollback, import and the issue actions `accept`, `revert` and `ignore_rule` also return a
      Plan. The one exception is the issue action `ignore_once`: it changes neither the state nor
      a guest (D-091).
    - No operation returns a secret value. Documents refer to a secret as `{secret: <name>}`
      (D-088). A change of a secret value is a sensitive change.
    - A Plan with a non-empty `human_only` can be approved by a human session only (D-099).
    - An operation with `x-plumb-planned: <card>` is part of the contract, but this server does
      not serve it yet. The card adds the handler and removes the mark.

    Authentication (`components.securitySchemes`):
    - `session`: cookie of a human user (`POST /session`). Every call that changes data must send
      an `Origin` header that matches the server. This includes `POST /session` (login CSRF).
    - `token`: API token as bearer. The roles listed for `token` on an operation are the
      **minimum tier**. Token tiers are ordered `read` < `plan` < `apply` (D-046).
    - An operation that lists only `session` is for humans only. A human session has the tier
      `admin`.
    - A session with `must_change_password` can only call the `/session` operations. Other calls
      return 403 `password-change-required`.
  license:
    name: Proprietary
    identifier: LicenseRef-Plumb
servers:
  - url: /api/v1
    description: Same origin as the web UI (port 8443).
security:
  - session: []
  - token: [read]
tags:
  - name: session
    description: Human login, logout and password change.
  - name: images
    description: Image documents of the desired state.
  - name: blocks
    description: Block documents of the desired state.
  - name: targets
    description: Target documents plus their live status.
  - name: plans
    description: Proposals, plans and approval.
  - name: runs
    description: Execution of approved plans.
  - name: issues
    description: Drift issues and their resolution.
  - name: rules
    description: Rule documents of the desired state (ignore drift by rule).
  - name: revisions
    description: Revision history, diff and rollback.
  - name: secrets
    description: Write-only secret store.
  - name: tokens
    description: API token management, for humans only.
  - name: state
    description: Export and import of the desired state.
  - name: events
    description: Server-sent event stream.

paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Read the current principal
      description: Works for a session and for a token. The UI uses it at start.
      security:
        - session: []
        - token: [read]
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                principal: "user:admin"
                must_change_password: false
                tier: admin
                expires_at: "2026-11-11T08:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [session]
      operationId: login
      summary: Log in a human user
      description: |
        Sets the `plumb_session` cookie (`HttpOnly`, `Secure`, `SameSite=Strict`). Failed logins
        are rate limited per user and per client address. The request must send an `Origin`
        header that matches the server, else 403 `origin-mismatch` (login CSRF).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { username: admin, password: correct-horse-battery-staple }
      responses:
        "200":
          description: Logged in. The cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema: { type: string }
              example: __Host-plumb_session=Qm9n...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                principal: "user:admin"
                must_change_password: true
                tier: admin
                expires_at: "2026-11-11T08:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [session]
      operationId: logout
      summary: Log out
      security:
        - session: []
      responses:
        "204":
          description: Logged out. The cookie is cleared.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /session/password:
    put:
      tags: [session]
      operationId: changePassword
      summary: Change the own password
      description: Required after the first login. Other sessions of the user end.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
            example:
              current_password: correct-horse-battery-staple
              new_password: a-much-longer-new-passphrase
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /images:
    get:
      tags: [images]
      operationId: listImages
      summary: List images
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of images from the head revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ImageView" }
              example:
                items:
                  - revision: 7
                    document:
                      kind: Image
                      name: ubuntu-26.04
                      spec:
                        type: vm
                        url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
                        sha256: 3f1c0a9e5d6b7c8a9f0e1d2c3b4a5968778695a4b3c2d1e0f9e8d7c6b5a49382
                  - revision: 7
                    document:
                      kind: Image
                      name: debian-13
                      spec:
                        title: Debian 13 (trixie)
                        type: vm
                        url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
                        sha256: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /images/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [images]
      operationId: getImage
      summary: Read one image
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageView" }
              example:
                revision: 7
                document:
                  kind: Image
                  name: debian-13
                  spec:
                    title: Debian 13 (trixie)
                    type: vm
                    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
                    sha256: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /blocks:
    get:
      tags: [blocks]
      operationId: listBlocks
      summary: List blocks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of blocks from the head revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BlockView" }
              example:
                items:
                  - revision: 7
                    document:
                      kind: Block
                      name: deploy-user
                      spec:
                        description: A user for deployments with an SSH key.
                        params:
                          type: object
                          required: [ssh_key]
                          properties:
                            name: { type: string, default: deploy }
                            ssh_key: { type: string }
                        resources:
                          - user:
                              name: "{{ .name }}"
                              shell: /bin/bash
                              ssh_keys: ["{{ .ssh_key }}"]
                  - revision: 7
                    document:
                      kind: Block
                      name: motd
                      spec:
                        description: Message of the day.
                        params:
                          type: object
                          properties:
                            text: { type: string, title: Message, default: Managed by Plumb. }
                        resources:
                          - file: { path: /etc/motd, content: "{{ .text }}\n", mode: "0644" }
                  - revision: 7
                    document:
                      kind: Block
                      name: web-app
                      spec:
                        title: Web app
                        description: An nginx site in front of an app port.
                        params:
                          type: object
                          required: [server_names]
                          properties:
                            server_names:
                              type: array
                              title: Server names
                              items: { type: string }
                              minItems: 1
                            port: { type: integer, title: App port, default: 8080, minimum: 1, maximum: 65535 }
                            tls: { type: boolean, title: Serve HTTPS, default: false }
                            log_level: { type: string, title: Log level, enum: [error, warn, info], default: warn }
                            extra_config:
                              type: string
                              title: Extra nginx config
                              contentMediaType: text/plain
                              default: ""
                        resources:
                          - package: { name: nginx }
                          - file: { path: /etc/nginx/sites-enabled/app.conf, content: "server_name {{ .server_names }};\n" }
                          - service: { name: nginx, restart_on: ["file:/etc/nginx/sites-enabled/app.conf"] }
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /blocks/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [blocks]
      operationId: getBlock
      summary: Read one block
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockView" }
              example:
                revision: 7
                document:
                  kind: Block
                  name: motd
                  spec:
                    description: Message of the day.
                    params:
                      type: object
                      properties:
                        text: { type: string, default: Managed by Plumb. }
                    resources:
                      - file: { path: /etc/motd, content: "{{ .text }}\n", mode: "0644" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /targets:
    get:
      tags: [targets]
      operationId: listTargets
      summary: List targets with status
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of targets from the head revision, each with its live status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TargetView" }
              example:
                items:
                  - revision: 7
                    document:
                      kind: Target
                      name: web1
                      spec:
                        type: vm
                        image: ubuntu-26.04
                        guest: { cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp }
                        blocks:
                          - use: deploy-user
                            params: { ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm me@laptop" }
                          - { use: motd }
                        overrides: {}
                    status:
                      phase: drifted
                      agent: online
                      power: running
                      last_seen: "2026-11-10T09:14:02Z"
                      guest_id: "9001"
                      ips: [192.168.1.41]
                      applied_revision: 7
                      open_issues: 1
                      last_run_id: 3
                  - revision: 6
                    document:
                      kind: Target
                      name: db1
                      spec:
                        type: vm
                        image: debian-13
                        guest: { cores: 4, memory: 8192, disk: 100, bridge: vmbr0, ip: 192.168.1.20/24 }
                        blocks: [{ use: motd }]
                        overrides: {}
                    status:
                      phase: ready
                      agent: online
                      power: running
                      last_seen: "2026-11-10T09:14:05Z"
                      guest_id: "9002"
                      ips: [192.168.1.20]
                      applied_revision: 6
                      open_issues: 0
                      last_run_id: 2
                  - revision: 7
                    document:
                      kind: Target
                      name: cache1
                      spec:
                        type: vm
                        image: ubuntu-26.04
                        guest: { cores: 1, memory: 1024, disk: 10, bridge: vmbr0, ip: dhcp }
                        blocks: []
                        overrides: {}
                    status:
                      phase: applying
                      agent: online
                      power: running
                      last_seen: "2026-11-10T09:14:01Z"
                      guest_id: "9003"
                      ips: [192.168.1.43]
                      applied_revision: 5
                      open_issues: 0
                      last_run_id: 4
                  - revision: 5
                    document:
                      kind: Target
                      name: backup1
                      spec:
                        type: vm
                        image: debian-13
                        guest: { cores: 2, memory: 2048, disk: 500, bridge: vmbr0, ip: dhcp }
                        blocks: []
                        overrides: {}
                    status:
                      phase: ready
                      agent: offline
                      power: stopped
                      last_seen: "2026-11-09T22:40:00Z"
                      guest_id: "9004"
                      ips: []
                      applied_revision: 5
                      open_issues: 0
                      last_run_id: 1
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /targets/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [targets]
      operationId: getTarget
      summary: Read one target with status
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetView" }
              example:
                revision: 7
                document:
                  kind: Target
                  name: web1
                  spec:
                    type: vm
                    image: ubuntu-26.04
                    guest: { cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp }
                    blocks:
                      - { use: motd }
                      - { use: motd, id: motd-banner, params: { text: "Second banner" } }
                    overrides: {}
                status:
                  phase: ready
                  agent: online
                  power: running
                  last_seen: "2026-11-10T09:14:02Z"
                  guest_id: "9001"
                  ips: [192.168.1.41]
                  applied_revision: 7
                  open_issues: 0
                  last_run_id: 3
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /targets/{name}/reenroll:
    parameters:
      - $ref: "#/components/parameters/DocName"
    post:
      tags: [targets]
      operationId: reenrollTarget
      summary: Propose a re-enrollment
      description: |
        Creates a Plan that restarts the guest with a new enrollment token (risk `disruptive`,
        D-038). The token is never a change: the driver passes it as `Bootstrap` (D-047).
        Nothing happens until the Plan is approved.
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
            example: { reason: Agent credential lost after disk restore. }
      responses:
        "201":
          description: The Plan.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 14
                origin: reenroll
                issue_id: null
                status: pending
                risk: disruptive
                reason: Agent credential lost after disk restore.
                author: "user:admin"
                created_at: "2026-11-10T09:20:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets:
                  - target: web1
                    resources:
                      - resource: "guest:config"
                        action: restart
                        risk: disruptive
                        changes:
                          - { attr: restart, risk: disruptive }
                warnings: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: List plans, newest first
      description: Items are full Plans, the same as `GET /plans/{id}`.
      parameters:
        - name: status
          in: query
          description: Only plans with this status.
          schema: { $ref: "#/components/schemas/PlanStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Plan" }
              example:
                items:
                  - id: 12
                    origin: proposal
                    issue_id: null
                    status: approved
                    risk: reversible
                    reason: Add MOTD to web1.
                    author: "token:tok_claude"
                    created_at: "2026-11-10T08:58:11Z"
                    base_revision: 6
                    approved_by: "user:admin"
                    approved_at: "2026-11-10T09:00:03Z"
                    revision: 7
                    run_id: 3
                    targets:
                      - target: web1
                        resources:
                          - resource: "file:/etc/motd"
                            action: create
                            risk: reversible
                            changes:
                              - { attr: state, from: absent, to: present, risk: reversible }
                              - { attr: content, to: "Hello from Plumb\n", risk: reversible }
                    warnings: []
                next: MTE
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [plans]
      operationId: createPlan
      summary: Propose a change
      description: |
        Validates and renders the proposal, observes the affected targets and stores a Plan with
        one entry per changed resource. A proposal that cannot be planned gets no Plan: 422 when
        a document is invalid, changes a create-only field (`ip`, `gateway`, `user`,
        `ssh_keys`, `disk`) or refers to a missing secret, 409 when the base revision moved.
        `targets` plans targets without a document change, for example after a new secret value
        (D-090).
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Proposal" }
            example:
              reason: Add MOTD to web1.
              put:
                - kind: Target
                  name: web1
                  spec:
                    type: vm
                    image: ubuntu-26.04
                    guest: { cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp }
                    blocks: [{ use: motd, params: { text: "Hello from Plumb" } }]
                    overrides: {}
              delete: []
      responses:
        "201":
          description: The Plan.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 12
                origin: proposal
                issue_id: null
                status: pending
                risk: reversible
                reason: Add MOTD to web1.
                author: "token:tok_claude"
                created_at: "2026-11-10T08:58:11Z"
                base_revision: 6
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets:
                  - target: web1
                    resources:
                      - resource: "file:/etc/motd"
                        action: create
                        risk: reversible
                        changes:
                          - { attr: state, from: absent, to: present, risk: reversible }
                          - { attr: content, to: "Hello from Plumb\n", risk: reversible }
                          - { attr: mode, to: "0644", risk: reversible }
                warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plans/{id}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [plans]
      operationId: getPlan
      summary: Read one plan
      responses:
        "200":
          description: The Plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 11
                origin: proposal
                issue_id: null
                status: stale
                risk: destructive
                reason: Remove old test VM.
                author: "user:admin"
                created_at: "2026-11-10T08:50:40Z"
                base_revision: 6
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets:
                  - target: test9
                    resources:
                      - resource: "guest:config"
                        action: delete
                        risk: destructive
                        changes:
                          - { attr: state, from: present, to: absent, risk: destructive }
                warnings: ["Head revision moved to 7. Propose again."]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [plans]
      operationId: discardPlan
      summary: Drop a pending plan
      description: |
        The Plan becomes `stale` and is never applied. An issue that it would resolve is `open`
        again. Only a `pending` Plan can be dropped; else 409.
      security:
        - session: []
        - token: [plan]
      responses:
        "204":
          description: Dropped.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /plans/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [plans]
      operationId: approvePlan
      summary: Approve a plan and start its run
      description: |
        Commits the Revision and starts a Run. An `apply` token can approve up to its `max_risk`
        (`reversible` or `disruptive`). Only a human session approves a `destructive` Plan or a
        Plan with a non-empty `human_only` (403 `human-required`, D-099). A stale Plan returns
        409; a Plan is also stale when a secret that it uses has another version (D-089).
      security:
        - session: []
        - token: [apply]
      requestBody:
        required: false
        content:
