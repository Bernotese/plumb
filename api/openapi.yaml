  /images/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [images]
      operationId: getImage
      x-plumb-rate: read
      summary: Read one image
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageView" }
              example:
                revision: 7
                document:
                  kind: Image
                  name: debian-13
                  spec:
                    title: Debian 13 (trixie)
                    type: vm
                    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
                    sha256: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /images/{name}/refresh:
    parameters:
      - $ref: "#/components/parameters/DocName"
    post:
      tags: [images]
      operationId: refreshImagePin
      x-plumb-rate: proposal
      summary: Propose the newest checksum of the base image from its source
      description: |
        For an Image with `verify` (D-335): the server fetches the checksum list of the source,
        checks the signature with a key pinned in the binary (not for `debian-https`, which has
        no signature), and finds the one entry for the file name of `url`. If the pin differs, it
        makes a Plan of origin `pin_refresh` that changes only the pin (`sha256` or `sha512`);
        `Plan.pins` shows source, key fingerprint, old and new pin. If the pin is current: 200
        `{status: unchanged}`, no Plan. The build schedule makes the same Plan before a
        scheduled build (author `system`).
        Approval: `human_only` gets `unverified-pin` when the source has no signature, when the
        signature creation time is not strictly newer than that of the last list this Image
        accepted from the same source (a replay or downgrade; the aplinfo index comes over plain
        http), when no signature time is stored yet for this Image and source (its first
        refresh), or when this Image used the new pin before; else a human with role `apply`, an
        `apply` token or `system` approves it, also for a built Image or an lxc Image (D-335 is the one
        exception to `image-recipe` of D-201, D-235). An Image without `verify` is 422. A fetch
