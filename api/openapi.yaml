openapi: 3.1.0
info:
  title: Plumb API
  version: 0.1.0
  summary: Public API of the Plumb controller.
  description: |
    The web UI, scripts and AI clients use only this API (ARCHITECTURE §4, D-023).

    Conventions:
    - JSON fields are `snake_case`. Times are UTC RFC 3339.
    - The API uses the same words and ids as the database and `internal/wire` (D-045).
      Revision, Plan, Run, Issue and comment ids are integers.
    - Document shapes (`Image`, `Block`, `Target`) are the JSON Schemas in
      `internal/state/schema`. This file refers to them and does not copy them (D-043).
    - A change is `{attr, from, to, risk}`: `from` is the guest now, `to` is the desired state.
      A missing value means "not there". A sensitive change is `{attr, sensitive, risk}`
      without values (D-047).
    - A principal is the string `user:<name>`, `token:<id>`, `agent:<target>` or `system`.
    - Errors are `application/problem+json` (RFC 9457) with a `urn:plumb:problem:<code>` type.
    - Lists return `{items, next}`. `next` is an opaque cursor; pass it as `cursor` to get the
      next page. `next` is `null` on the last page.
    - Every change goes through a Plan: propose (`POST /plans`), review, approve. Re-enroll,
      rollback, import and the issue actions `accept`, `revert` and `ignore_rule` also return a
      Plan. The one exception is the issue action `ignore_once`: it changes neither the state nor
      a guest (D-091).
    - No operation returns a secret value. Documents refer to a secret as `{secret: <name>}`
      (D-088). A change of a secret value is a sensitive change.
    - A Plan with a non-empty `human_only` can be approved by a human session only (D-099).
    - An operation with `x-plumb-planned: <card>` is part of the contract, but this server does
      not serve it yet. The card adds the handler and removes the mark.
    - Rate limit per API token (D-365): an operation with `x-plumb-rate: proposal` (every
      operation that a token may call and that makes a Plan) or `x-plumb-rate: comment` counts
      against one bucket per token and kind: 30 per minute, burst 30. `x-plumb-rate: read` (every
      `GET` that a token may call, except the event stream) counts against a third bucket: 600 per
      minute, burst 120. Over the limit: 429
      `rate-limited` with `Retry-After`, and nothing is done. A human session is not limited this
      way (the login limit stays). A test reads the marks, so every such operation has one.

    Authentication (`components.securitySchemes`):
    - `session`: cookie of a human user (`POST /session`). Every call that changes data must send
      an `Origin` header that matches the server. This includes `POST /session` (login CSRF).
    - `token`: API token as bearer. The roles listed for `token` on an operation are the
      **minimum tier**. Token tiers are ordered `read` < `plan` < `apply` (D-046).
    - An operation that lists only `session` is for humans only.
    - Roles of human users (D-329, D-330): every user has a role `read` < `plan` < `apply` <
      `admin`, on the scale of the token tiers. A session may call an operation when its role is at
      least the tier listed for `token`; an operation that lists only `session` needs `admin`. An
      operation may name another minimum with `x-plumb-role` (the `/session` operations: `read`,
      so every user can log out and change the own password). A role too low gives 403
      `forbidden`. The role is checked in addition to "human session": a Plan with `human_only`
      or of risk `destructive` needs a human session **and** a role that may approve it
      (`apply` up to `disruptive`, `admin` for `destructive`). The same holds inside operations:
      `ignore_once` by a session needs role `apply` up to `disruptive` and `admin` for a
      `destructive` change.
    - A session with `must_change_password` can only call the `/session` operations. Other calls
      return 403 `password-change-required`.

    Restored mode (D-290, D-303): after `plumb restore` the controller observes, but sends no
    Proxmox write and no agent command except `observe` until a person confirms
    `POST /restore/confirm`. Until then these return 409 `restored-mode`: `POST /plans/{id}/approve`,
    `POST /targets/{name}/reenroll`, `POST /images/{name}/build`, `POST /backups`. Creating a Plan
    (a proposal, an issue action, a rollback, an import, an agent update) still works; it waits
    for the confirm. A restore disables every API token (`Token.disabled_at`), drops every
    session, gives the user `admin` a new random password (shown once on the installer
    terminal; the old one no longer works) and locks every other user.
  license:
    name: Proprietary
    identifier: LicenseRef-Plumb
servers:
  - url: /api/v1
    description: Same origin as the web UI (port 8443).
security:
  - session: []
  - token: [read]
tags:
  - name: session
    description: Human login, logout and password change.
  - name: images
    description: Image documents of the desired state.
  - name: blocks
    description: Block documents of the desired state.
  - name: targets
    description: Target documents plus their live status.
  - name: plans
    description: Proposals, plans and approval.
  - name: runs
    description: Execution of approved plans.
  - name: issues
    description: Drift issues and their resolution.
  - name: rules
    description: Rule documents of the desired state (ignore drift by rule).
  - name: revisions
    description: Revision history, diff and rollback.
  - name: secrets
    description: Write-only secret store.
  - name: tokens
    description: API token management, for humans only.
  - name: state
    description: Export and import of the desired state.
  - name: events
    description: Server-sent event stream.
  - name: backup
    description: Backups of the controller and the restore state (D-288 … D-290, D-302 … D-304).
  - name: settings
    description: Controller settings and the read-only view of the Proxmox connection (D-361).

paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      x-plumb-rate: read
      x-plumb-role: read
      summary: Read the current principal
      description: Works for a session and for a token. The UI uses it at start.
      security:
        - session: []
        - token: [read]
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                principal: "user:admin"
                must_change_password: false
                tier: admin
                expires_at: "2026-11-11T08:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [session]
      operationId: login
      summary: Log in a human user
      description: |
        Sets the `plumb_session` cookie (`HttpOnly`, `Secure`, `SameSite=Strict`). Failed logins
        are rate limited per user and per client address. The request must send an `Origin`
        header that matches the server, else 403 `origin-mismatch` (login CSRF).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { username: admin, password: correct-horse-battery-staple }
      responses:
        "200":
          description: Logged in. The cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema: { type: string }
              example: __Host-plumb_session=Qm9n...; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                principal: "user:admin"
                must_change_password: true
                tier: admin
                expires_at: "2026-11-11T08:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [session]
      operationId: logout
      x-plumb-role: read
      summary: Log out
      security:
        - session: []
      responses:
        "204":
          description: Logged out. The cookie is cleared.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /session/password:
    put:
      tags: [session]
      operationId: changePassword
      x-plumb-role: read
      summary: Change the own password
      description: Required after the first login. Other sessions of the user end.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
            example:
              current_password: correct-horse-battery-staple
              new_password: a-much-longer-new-passphrase
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users:
    get:
      tags: [session]
      operationId: listUsers
      summary: List the human users
      description: |
        Admin session only (D-330). Disabled users stay in the list; their names are never given
        again. Sorted by name.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
              example:
                items:
                  - name: admin
                    role: admin
                    disabled: false
                    locked: false
                    must_change_password: false
                    created_at: "2026-11-10T08:00:00Z"
                    created_by: system
                    last_login_at: "2026-11-13T07:58:12Z"
                  - name: alice
                    role: apply
                    disabled: false
                    locked: false
                    must_change_password: true
                    created_at: "2026-11-13T09:00:00Z"
                    created_by: "user:admin"
                    last_login_at: null
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [session]
      operationId: createUser
      summary: Make a new user with a one-time password
      description: |
        Admin session only, never a token (D-330). The server makes a random one-time password,
        shows it once in the response and stores only its hash (rules of D-321); the user must
        change it at the first login. A name that exists, also a disabled one, is 409
        `user-exists`. Works also in restored mode. Emits `user.created` (no password).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
            example: { name: alice, role: apply }
      responses:
        "201":
          description: The user and its one-time password. The password is not shown again.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OneTimePassword" }
              example:
                username: alice
                password: Zq0v3cN1x9LkPq2aR7sT8w
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /users/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: User name.
        schema: { type: string, minLength: 1, maxLength: 64 }
        example: alice
    patch:
      tags: [session]
      operationId: changeUser
      summary: Change the role of a user, or disable or enable it
      description: |
        Admin session only, never a token (D-330). There is no delete: a disabled user cannot log
        in and keeps its name for ever. A change of `role` or `disabled` ends every session of
        that user. When the user loses `admin` or is disabled, every API token it created that
        is not revoked gets `disabled_at` (401 until `POST /tokens/{id}/enable`). The own user is
        409 `own-user`. Demoting or disabling the last enabled `admin` is 409 `last-admin`; the
        server counts and changes in one transaction. A change that changes nothing is 200 with
        the user. Emits `user.changed` with `{role, disabled}`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeUserRequest" }
            example: { role: plan }
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example:
                name: alice
                role: plan
                disabled: false
                locked: false
                must_change_password: true
                created_at: "2026-11-13T09:00:00Z"
                created_by: "user:admin"
                last_login_at: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{name}/password:
    parameters:
      - name: name
        in: path
        required: true
        description: User name.
        schema: { type: string, minLength: 1, maxLength: 64 }
        example: alice
    post:
      tags: [session]
      operationId: resetUserPassword
      summary: Give another user a new one-time password
      description: |
        Human session only, never a token (D-321). The server makes a new random password, shows it
        once in the response and stores only its hash. The user must change it at the first login
        (`must_change_password`). A lock of a restore ends (D-311), and every session of the user
        ends. The own password changes with `PUT /session/password` (409 `own-user`). Works also in
        restored mode. Emits `user.password_reset`; the event holds no password.
      security:
        - session: []
      responses:
        "200":
          description: The one-time password. It is not stored and not shown again.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OneTimePassword" }
              example:
                username: alice
                password: Zq0v3cN1x9LkPq2aR7sT8w
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /catalog/blocks:
    get:
      tags: [blocks]
      operationId: listCatalogBlocks
      x-plumb-rate: read
      summary: List the starter Blocks that ship with Plumb
      description: |
        The Blocks embedded in this binary (D-328), sorted by name, compared with the head
        revision: `stored` is `none` (no Block of this name), `same` (the stored Block equals the
        catalogue Block) or `differs`. Plumb never puts a catalogue Block by itself: a client adds
        or updates one with a normal proposal (`POST /plans`, `put` of the `yaml`), and the Plan
        shows the diff. No paging (the catalogue is small).
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogBlock" }
              example:
                items:
                  - name: motd
                    title: Message of the day
                    description: Set /etc/motd.
                    kinds: [vm, lxc]
                    sha256: "5f0c3d2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a392817060"
                    stored: differs
                    yaml: "kind: Block\nname: motd\nspec:\n  ...\n"
                    document:
                      kind: Block
                      name: motd
                      spec:
                        title: Message of the day
                        params:
                          type: object
                          properties:
                            text: { type: string, default: "Managed by Plumb\n" }
                        resources:
                          - file:
                              path: /etc/motd
                              content: "{{ .text }}"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /images:
    get:
      tags: [images]
      operationId: listImages
      x-plumb-rate: read
      summary: List images
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of images from the head revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ImageView" }
              example:
                items:
                  - revision: 7
                    document:
                      kind: Image
                      name: ubuntu-26.04
                      spec:
                        type: vm
                        url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
                        sha256: 3f1c0a9e5d6b7c8a9f0e1d2c3b4a5968778695a4b3c2d1e0f9e8d7c6b5a49382
                  - revision: 7
                    document:
                      kind: Image
                      name: debian-13
                      spec:
                        title: Debian 13 (trixie)
                        type: vm
                        url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
                        sha256: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
                  - revision: 7
