                    status: open
                    risk: reversible
                    opened_at: "2026-11-10T09:10:12Z"
                    updated_at: "2026-11-10T09:10:12Z"
                    changes:
                      - { attr: content, from: "Hand-edited\n", to: "Hello from Plumb\n", risk: reversible }
                    actions: [accept, revert]
                    plan_id: null
                    resolution: null
                    comments: []
                  - id: 9
                    target: web1
                    resource: "file:/etc/app.conf"
                    status: open
                    risk: reversible
                    opened_at: "2026-11-10T09:11:30Z"
                    updated_at: "2026-11-10T09:11:30Z"
