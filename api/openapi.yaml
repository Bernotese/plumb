  /issues/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [issues]
      operationId: resolveIssue
      summary: Resolve an issue
      description: |
        `accept` and `revert` create a Plan; the issue is `resolving` until its Run succeeds.
        `accept` is not offered for a sensitive change. Allowed actions are in `Issue.actions`;
        the list does not depend on the caller.

        `ignore_rule` creates a Plan that puts one `Rule` (origin `ignore_rule`, D-092). `rule`
        in the request sets its scope. Only a human session approves this Plan (D-099). The
        issue resolves as `ignore` when the revision commits.

        `ignore_once` answers 200 with the resolved Issue and makes no Plan (D-091). A later
        report with equal changes opens no Issue, until the resource reports no drift or a Run
        applies it. Who may call it: a human session; an `apply` token when every change of the
        Issue has a risk up to its `max_risk` and none is sensitive. Every other token gets 403
        `human-required` or `risk-too-high`.
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
            example: { action: revert, reason: Undo the manual edit. }
      responses:
        # T-025 question 3 (open): who may use `ignore_once`. The rule is in the description
        # above and in D-091. Another answer changes only that text.
        "200":
          description: The resolved Issue, for `ignore_once`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
              example:
                id: 7
                target: web1
                resource: "file:/etc/motd"
                status: resolved
                risk: reversible
                opened_at: "2026-11-10T09:10:12Z"
                updated_at: "2026-11-10T09:16:00Z"
                changes:
                  - { attr: content, from: "Hand-edited\n", to: "Hello from Plumb\n", risk: reversible }
                actions: []
                plan_id: null
                resolution: { action: ignore, by: "user:admin", at: "2026-11-10T09:16:00Z" }
                comments: []
        "201":
          description: The Plan that resolves the issue, for `accept`, `revert` and `ignore_rule`.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 15
                origin: revert
                issue_id: 7
                status: pending
                risk: reversible
                reason: Undo the manual edit.
                author: "user:admin"
                created_at: "2026-11-10T09:15:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets:
                  - target: web1
                    resources:
                      - resource: "file:/etc/motd"
                        action: update
                        risk: reversible
                        changes:
                          - { attr: content, from: "Hand-edited\n", to: "Hello from Plumb\n", risk: reversible }
                warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /issues/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [issues]
      operationId: commentIssue
      summary: Add a comment to an issue
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
            example: { body: The shell change came from a manual chsh. Revert is safe. }
      responses:
        "201":
          description: The new comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
              example:
                id: 2
                author: "token:tok_claude"
                body: The shell change came from a manual chsh. Revert is safe.
                created_at: "2026-11-10T09:13:02Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List rules
      description: |
        Rules of the head revision (D-092). A rule makes the controller drop matching drift at
        intake. A rule is a document: create, change and delete it with a proposal
        (`POST /plans`) or with the issue action `ignore_rule`. Only a human session approves a
        Plan that changes a rule (D-099).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of rules from the head revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RuleView" }
              example:
                items:
                  - revision: 9
                    document:
                      kind: Rule
                      name: ignore-web1-motd
                      spec: { action: ignore, target: web1, resource: "file:/etc/motd", attrs: [content] }
                  - revision: 10
                    document:
                      kind: Rule
                      name: ignore-all-apt-periodic
                      spec: { action: ignore, target: "*", resource: "file:/etc/apt/apt.conf.d/20auto-upgrades" }
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rules/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [rules]
      operationId: getRule
      summary: Read one rule
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleView" }
              example:
                revision: 9
                document:
                  kind: Rule
                  name: ignore-web1-motd
                  spec: { action: ignore, target: web1, resource: "file:/etc/motd", attrs: [content] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /revisions:
    get:
      tags: [revisions]
      operationId: listRevisions
      summary: List revisions, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of revisions. The first item of the first page is the head.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RevisionInfo" }
              example:
                items:
                  - id: 7
                    author: "user:admin"
                    reason: Add MOTD to web1.
                    plan_id: 12
                    created_at: "2026-11-10T09:00:03Z"
                    documents: 6
                  - id: 6
                    author: "token:tok_ci"
                    reason: Raise memory of db1.
                    plan_id: 11
                    created_at: "2026-11-09T18:20:44Z"
                    documents: 6
                next: MTE
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /revisions/{n}/diff:
    parameters:
      - $ref: "#/components/parameters/RevisionN"
    get:
      tags: [revisions]
      operationId: diffRevision
      summary: Compare a revision with another one
      description: |
        Lists the documents that differ between revision `from` and revision `n`, with both
        versions (D-093). Without `from` the base is `n-1`; for revision 1 it is the empty state.
        Documents hold secret references, never secret values, so the diff shows no value.
      parameters:
        - name: from
          in: query
          description: The base revision. Default `n-1`.
          schema: { $ref: "#/components/schemas/Revision" }
          example: 6
      responses:
        "200":
          description: The changed documents, sorted by kind and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionDiff" }
              example:
                from: 6
                to: 7
                changes:
                  - kind: Block
                    name: motd
                    op: added
                    before: null
                    after:
                      kind: Block
                      name: motd
                      spec:
                        description: Message of the day.
                        params:
                          type: object
                          properties:
                            text: { type: string, default: Managed by Plumb. }
                        resources:
                          - file: { path: /etc/motd, content: "{{ .text }}\n", mode: "0644" }
                  - kind: Target
                    name: web1
                    op: changed
                    before:
                      kind: Target
                      name: web1
                      spec:
                        type: vm
                        image: ubuntu-26.04
                        guest: { cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp }
                        blocks: []
                        overrides: {}
                    after:
                      kind: Target
                      name: web1
                      spec:
                        type: vm
                        image: ubuntu-26.04
                        guest: { cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp }
                        blocks: [{ use: motd, params: { text: "Hello from Plumb" } }]
                        overrides: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /revisions/{n}/rollback:
    parameters:
      - $ref: "#/components/parameters/RevisionN"
    post:
      tags: [revisions]
      operationId: rollbackRevision
      summary: Plan a rollback to a revision
      description: |
        Builds a proposal that puts and deletes documents until the document set equals revision
        `n`, and returns its Plan (origin `rollback`). Nothing changes before the approval. The
        Plan follows every rule of `POST /plans`. Secret values have no history and do not roll
        back (D-093). A rollback that brings back a secret binding or changes a rule can be
        approved by a human session only (`Plan.human_only`, D-099). The Plan records `n` as
        `rollback_to` (D-131).
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
            example: { reason: The MOTD change was wrong. }
      responses:
        "201":
          description: The rollback Plan.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 16
                origin: rollback
                rollback_to: 6
                issue_id: null
                status: pending
                risk: reversible
                reason: The MOTD change was wrong.
                author: "user:admin"
                created_at: "2026-11-10T09:20:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                human_only: []
                targets:
                  - target: web1
                    secrets: []
                    resources: []
                warnings:
                  - "file:/etc/motd on web1 is no longer managed. Plumb does not delete it on the guest."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The document set of revision `n` equals the head (`nothing-to-do`), or the head moved
            while the Plan was made.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:plumb:problem:nothing-to-do"
                title: Nothing to do
                status: 409
                detail: Revision 7 has the same documents as the head revision.
        "422": { $ref: "#/components/responses/Unprocessable" }

  /secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secrets (names only)
      description: |
        Names and metadata of all secrets, sorted by name. No operation of this API returns a
        secret value (D-030, D-087). `used_by` lists the targets of the head revision that
        refer to the secret.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of secret metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/SecretInfo" }
              example:
                items:
                  - name: app-db
                    version: 4
                    updated_by: "user:admin"
                    updated_at: "2026-11-10T08:40:00Z"
                    used_by: [web1]
                  - name: deploy-key
                    version: 2
                    updated_by: "user:admin"
                    updated_at: "2026-11-09T17:05:10Z"
                    used_by: []
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/SecretName"
    put:
      tags: [secrets]
      operationId: putSecret
      summary: Create a secret or replace its value
      description: |
        Stores the value encrypted (D-087). Human session only. A new value changes no guest by
        itself, and it makes pending Plans that use the secret stale (D-089). To send it to the
        guests, plan the targets of `used_by` with `Proposal.targets` (D-090).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
            example: { value: "<the secret value>" }
      responses:
        "200":
          description: The metadata of the secret after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretInfo" }
              example:
                name: app-db
                version: 5
                updated_by: "user:admin"
                updated_at: "2026-11-10T09:25:00Z"
                used_by: [web1]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: |
        Human session only. A secret that the head revision or a pending Plan uses cannot be
        deleted: 409 `secret-in-use` with `targets` and `plans`.
      security:
        - session: []
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The secret is in use (`secret-in-use`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:plumb:problem:secret-in-use"
                title: Secret is in use
                status: 409
                detail: Secret "app-db" is used by 1 target and 1 pending Plan.
                targets: [web1]
                plans: [16]

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List API tokens, newest first
      description: Human session only. Revoked tokens stay in the list. No bearer value or hash is returned.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tokens.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Token" }
              example:
                items:
                  - id: tok_claude
                    name: Claude (plans and comments)
                    tier: plan
                    max_risk: null
                    created_by: "user:admin"
                    created_at: "2026-11-10T08:00:00Z"
                    last_used_at: "2026-11-10T09:13:02Z"
                    revoked_at: null
                  - id: tok_ci
                    name: CI deploy
                    tier: apply
                    max_risk: reversible
                    created_by: "user:admin"
                    created_at: "2026-11-09T12:00:00Z"
                    last_used_at: null
                    revoked_at: "2026-11-09T18:30:00Z"
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token
      description: |
        Human session only. The answer holds the bearer value once; Plumb stores only a hash.
        Only an `apply` token has a `max_risk` (D-046). An `apply` token is root-equivalent on
        the guests.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
            example: { name: CI deploy, tier: apply, max_risk: reversible }
      responses:
        "201":
          description: The token and its bearer value.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
              example:
                token:
                  id: tok_ci
                  name: CI deploy
                  tier: apply
                  max_risk: reversible
                  created_by: "user:admin"
                  created_at: "2026-11-10T09:30:00Z"
                  last_used_at: null
                  revoked_at: null
                bearer: "tok_ci.<secret part, shown once>"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke an API token
      description: |
        Human session only. The token fails at its next call and its open event streams end
        (D-070). The row stays in the list with `revoked_at`. Revoking a revoked token is 204.
      security:
        - session: []
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export:
    get:
      tags: [state]
      operationId: exportState
      summary: Export the desired state without secret values
      description: |
        One YAML stream of the head revision (D-094): a header document `kind: Export`, then
        every document sorted by kind and name. The header lists the names of all secrets; the
        file holds no secret value.
      responses:
        "200":
          description: The export file.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/yaml:
              schema: { type: string }
              example: |
                kind: Export
                format: 1
                revision: 7
                exported_at: "2026-11-10T09:30:00Z"
                version: 0.2.0
                secrets: [app-db]
                ---
                kind: Block
                name: motd
                spec:
                  description: Message of the day.
                  params:
                    type: object
                    properties:
                      text: {type: string, default: Managed by Plumb.}
                  resources:
                    - file: {path: /etc/motd, content: "{{ .text }}\n", mode: "0644"}
                ---
                kind: Target
                name: web1
                spec:
                  type: vm
                  image: ubuntu-26.04
                  guest: {cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp}
                  blocks:
                    - {use: motd, params: {text: Hello from Plumb}}
                  overrides: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [state]
      operationId: exportStateWithSecrets
      summary: Export the desired state with an encrypted secret bundle
      description: |
        Human session only. The same file as `GET /export` plus a last document
        `kind: SecretBundle`: all secret values, encrypted with a key from the passphrase
        (argon2id with the fixed parameters of format 1, AES-256-GCM; D-094). 429 when the
        argon2 slots are busy.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
            example: { passphrase: "<a passphrase of 12 or more characters>" }
      responses:
        "200":
          description: The export file with the secret bundle.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/yaml:
              schema: { type: string }
              example: |
                kind: Export
                format: 1
                revision: 7
                exported_at: "2026-11-10T09:30:00Z"
                version: 0.2.0
                secrets: [app-db]
                ---
                kind: Target
                name: web1
                spec:
                  type: vm
                  image: ubuntu-26.04
                  guest: {cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp}
                  blocks:
                    - {use: app, params: {db_password: {secret: app-db}}}
                  overrides: {}
                ---
                kind: SecretBundle
                kdf: {name: argon2id, time: 3, memory_kib: 65536, threads: 4}
                salt: "<base64>"
                nonce: "<base64>"
                data: "<base64 ciphertext>"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /import:
    post:
      tags: [state]
      operationId: importState
      summary: Plan an import of an export file
      description: |
        Human session only. Reads an export file and returns a Plan (origin `import`). Nothing
        in the desired state changes before the approval (D-095). Mode `replace` deletes the
        documents that are not in the file; `merge` only puts.

        Secrets: with a `passphrase`, the secrets of the bundle that do not exist yet are
        created at once. A secret that exists with the same value is skipped. A secret that
        exists with another value stops the import with 409 `secret-conflict` and nothing is
        written, unless `overwrite` names it. Created and overwritten names are in
        `Plan.warnings`; they stay when the Plan is dropped.

        422: an invalid document, an unknown `format`, YAML anchors or aliases, a wrong
        passphrase, a name in `overwrite` that is not in the bundle, or a reference to a missing
        secret (`secrets` lists the names). 400: a body above 8 MiB. 429: the argon2 slots are
        busy.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
            example:
              reason: Restore the state of 2026-11-09.
              mode: replace
              content: "kind: Export\nformat: 1\nrevision: 7\nexported_at: \"2026-11-10T09:30:00Z\"\nversion: 0.2.0\nsecrets: []\n---\nkind: Target\nname: cache1\nspec:\n  type: vm\n  image: ubuntu-26.04\n  guest: {cores: 1, memory: 1024, disk: 10, bridge: vmbr0, ip: dhcp}\n  blocks: []\n  overrides: {}\n"
      responses:
        "201":
          description: The import Plan.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 17
                origin: import
                issue_id: null
                status: pending
                risk: destructive
                reason: Restore the state of 2026-11-09.
                author: "user:admin"
                created_at: "2026-11-10T09:40:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                human_only: []
                targets:
                  - target: web1
                    resources:
                      - resource: "guest:config"
                        action: delete
                        risk: destructive
                        changes:
                          - { attr: state, from: present, to: absent, risk: destructive }
                warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            A secret of the bundle exists with another value and is not in `overwrite`
            (`secret-conflict`), or the head moved while the Plan was made.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: "urn:plumb:problem:secret-conflict"
                title: Secrets exist with another value
                status: 409
                detail: 1 secret of the file differs from the stored value. Nothing was written. Name it in "overwrite" to replace it.
                secrets: [app-db]
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /backups:
    get:
      tags: [backup]
      operationId: listBackups
      summary: List the backups of this controller and the state of the off-host copy
      description: |
        Backups in the data directory of the controller, newest first (D-288, D-302), the
        schedule, the last run, and the state of the off-host copy that a timer on the Proxmox host
        makes (D-289). There is no download route: a backup holds the CA key and the agent
        identities (encrypted), and it leaves the container only by the host timer.
      responses:
        "200":
          description: The backups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
              example:
                schedule: { time: "03:00", keep: 7 }
                running: false
                last_run:
                  started_at: "2026-11-13T03:00:00Z"
                  finished_at: "2026-11-13T03:00:04Z"
                  result: ok
                  by: system
                  name: plumb-20261113T030000Z.pbk
                  message: ""
                items:
                  - name: plumb-20261113T030000Z.pbk
                    created_at: "2026-11-13T03:00:04Z"
                    size: 2621440
                    sha256: 9f2c3d4e5f60718293a4b5c6d7e8f9011223344556677889900aabbccddeeff0
                copy:
                  state: ok
                  at: "2026-11-13T03:30:02Z"
                  name: plumb-20261113T030000Z.pbk
                  storage: nas-backup
                  message: ""
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [backup]
      operationId: createBackup
      summary: Start a backup now
      description: |
        Starts one backup outside the schedule. It counts for the retention like a scheduled one.
        The answer comes at once; `backup.finished` tells the end. A human session or an `apply`
        token. 409 `backup-running` while one runs; 409 `restored-mode` before the confirm
        (D-303).
      security:
        - session: []
        - token: [apply]
      responses:
        "202":
          description: The backup started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
              example:
                started_at: "2026-11-13T10:15:00Z"
                finished_at: null
                result: running
                by: "user:admin"
                name: null
                message: ""
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /restore:
    get:
      tags: [backup]
      operationId: getRestore
      summary: Restore state of this controller
      description: |
        `restored: false` on a controller that was never restored. After `plumb restore`: the
        backup it came from, whether restored mode still holds, the guests in the pool that the
        restored state does not know, and how many tokens wait to be enabled again (D-290,
        D-303).
      responses:
        "200":
          description: The restore state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreState" }
              example:
                restored: true
                restored_mode: true
                backup_created_at: "2026-11-13T03:00:04Z"
                restored_at: "2026-11-13T11:02:40Z"
                confirmed_at: null
                confirmed_by: null
                disabled_tokens: 2
                locked_users: [bob]
                unknown_guests:
                  - { guest_id: "112", name: web3, type: vm, template: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /restore/confirm:
    post:
      tags: [backup]
      operationId: confirmRestore
      summary: End restored mode
      description: |
        A person confirms that the old controller is off (D-290). Human session only: a token
        gets 403 `human-required`. After it the engine, the schedules and the agent commands run
        again, and `agent:silent` starts to count (D-303). 409 `nothing-to-do` when the controller
        is not in restored mode. The confirm sends the current watch list to every online agent:
        until then they keep the watch list of the old controller.
        Before restored mode ends, the server observes the guest of every Target once: a gone
        guest or a guest of another name opens `guest:missing` (D-322). When Proxmox does not
        answer for a guest, the confirm is 409 `restore-check-failed` and restored mode stays.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreConfirm" }
            example: { old_controller_off: true, reason: The old LXC is destroyed. }
      responses:
        "200":
          description: The restore state after the confirm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreState" }
              example:
                restored: true
                restored_mode: false
                backup_created_at: "2026-11-13T03:00:04Z"
                restored_at: "2026-11-13T11:02:40Z"
                confirmed_at: "2026-11-13T11:10:00Z"
                confirmed_by: "user:admin"
                disabled_tokens: 2
                locked_users: [bob]
                unknown_guests:
                  - { guest_id: "112", name: web3, type: vm, template: false }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tokens/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    post:
      tags: [tokens]
      operationId: enableToken
      summary: Enable a token that a restore disabled
      description: |
        Human session only (D-303). Works also in restored mode, so a person can give one client
        access back on purpose. A revoked token stays revoked (409 `token-revoked`). Enabling an
        enabled token is 200.
      security:
        - session: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
              example:
                id: tok_ci
                name: ci
                tier: plan
                max_risk: null
                created_by: "user:admin"
                created_at: "2026-11-10T09:00:00Z"
                last_used_at: "2026-11-13T02:55:00Z"
                revoked_at: null
                disabled_at: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Stream events (server-sent events)
      description: |
        A `text/event-stream`. Each message has `id` (the event `seq`), `event` (the type) and
        `data` (an `Event` as JSON). Resume with `since` or the `Last-Event-ID` header. The server
        sends a comment line every 15 s as keep-alive. Payloads never hold secret values.
        The stream ends when the session ends or the token is revoked. A principal can hold 8
        streams at a time; more get 429.
      parameters:
        - name: since
          in: query
          description: Send events with a `seq` greater than this. Default is new events only.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 1041
        - name: Last-Event-ID
          in: header
          description: Same as `since`. Browsers send it on reconnect.
          schema: { type: string }
          example: "1041"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE frames. Each `data` line is one `Event` (components.schemas.Event) as JSON."
              example: |
                id: 1042
                event: run.step
                data: {"seq":1042,"type":"run.step","time":"2026-11-10T09:00:05Z","subject":"run:3","actor":"agent:web1","data":{"target":"web1","resource":"file:/etc/motd","status":"applied"}}

                id: 1043
                event: issue.opened
                data: {"seq":1043,"type":"issue.opened","time":"2026-11-10T09:10:12Z","subject":"issue:7","actor":"agent:web1","data":{"target":"web1","resource":"file:/etc/motd"}}

        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-plumb_session
      description: |
        Human session (`POST /session`) with tier `admin`. `HttpOnly`, `Secure`,
        `SameSite=Strict`. In `plumb serve --dev` (plain HTTP) the cookie is `plumb_session`
        without `Secure`. Every call that changes data, login included, must send a matching
        `Origin` header. Only a session approves `destructive` Plans and Plans with
        `human_only` (D-099), and manages tokens, secrets, export with secrets and import.
    token:
      type: http
      scheme: bearer
      description: |
        API token. Tiers: `read` < `plan` (propose, comment, resolve with a Plan) < `apply`
        (approve, and `ignore_once`, up to the token's `max_risk`: `reversible` or `disruptive`).
        No token has `admin` (D-046). The roles listed on an operation are the minimum tier. An
        `apply` token is root-equivalent on guests.

  headers:
    Location:
      description: URL of the created resource.
      schema: { type: string }
      example: /api/v1/plans/12
    NoStore:
      description: Always `no-store`. The body holds a credential or the whole state.
      schema: { type: string, const: no-store }
      example: no-store

  parameters:
    DocName:
      name: name
      in: path
      required: true
      description: Document name.
      schema: { $ref: "#/components/schemas/Name" }
      example: web1
    PlanId:
      name: id
      in: path
      required: true
      description: Plan id.
      schema: { $ref: "#/components/schemas/Id" }
      example: 12
    RunId:
      name: id
      in: path
      required: true
      description: Run id.
      schema: { $ref: "#/components/schemas/Id" }
      example: 3
    IssueId:
      name: id
      in: path
      required: true
      description: Issue id.
      schema: { $ref: "#/components/schemas/Id" }
      example: 7
    RevisionN:
      name: n
      in: path
      required: true
      description: Revision number.
      schema: { $ref: "#/components/schemas/Revision" }
      example: 7
    SecretName:
      name: name
      in: path
      required: true
      description: Secret name.
      schema: { $ref: "#/components/schemas/Name" }
      example: app-db
    TokenId:
      name: id
      in: path
      required: true
      description: Token id (the public part of the bearer value).
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: tok_ci
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      example: 50
    Cursor:
      name: cursor
      in: query
      description: The `next` value of the previous page.
      schema: { type: string, maxLength: 512 }
      example: MTE

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:bad-request"
            title: Bad request
            status: 400
            detail: "Request body is not valid JSON: unexpected end of input."
    Unauthorized:
      description: Not logged in, wrong credentials, or the session expired.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:unauthenticated"
            title: Authentication required
            status: 401
    Forbidden:
      description: |
        The principal lacks the tier or risk limit (`forbidden`, `risk-too-high`), the call needs
        a human session (`human-required`), the origin check failed (`origin-mismatch`), or a
        password change is required (`password-change-required`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:risk-too-high"
            title: Risk exceeds token limit
            status: 403
            detail: Plan risk is destructive. Token max_risk is disruptive. A human must approve.
    NotFound:
      description: The object does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:not-found"
            title: Not found
            status: 404
            detail: Target "web9" does not exist in the head revision.
    Conflict:
      description: |
        The object is in a state that does not allow the action: a stale Plan, a moved head
        revision, or an issue that is not open. Slice 2 codes: `secret-in-use`,
        `secret-conflict`, `nothing-to-do`. Image builds: `build-running`. Slice 3:
        `agent-outdated` (D-259): the desired state of a Target needs a resource type or attribute
        that its agent did not report; `detail` starts with "update the agent first", `targets`
        names the Targets and `missing` what they lack. Plans of every origin that send resources
        to an agent are checked at creation and at approval; the Run checks again at start.
        Slice 4 (D-303): `restored-mode` (the controller waits for `POST /restore/confirm`),
        `backup-running`, `token-revoked`, `own-user` (D-321), `restore-check-failed` (D-322).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:plan-stale"
            title: Plan is stale
            status: 409
            detail: The head revision moved from 6 to 7. Propose again.
    Unprocessable:
      description: The request is well-formed but fails validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:validation"
            title: Validation failed
            status: 422
            errors:
              - pointer: /put/0/spec/guest/disk
                message: disk is create-only in this version. Create a new target instead.
    TooManyRequests:
      description: Too many failed logins, or too many requests of one kind at a time.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
          example: 30
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "urn:plumb:problem:rate-limited"
            title: Too many attempts
            status: 429
            detail: Try again in 30 seconds.

  schemas:
    Name:
      type: string
      description: Document name. Lowercase letters, digits, `-` and `.`.
      pattern: "^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$"
      examples: [web1]
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Id of a Plan, Run, Issue or comment.
      examples: [12]
    NullableId:
      oneOf:
        - $ref: "#/components/schemas/Id"
        - type: "null"
    Revision:
      type: integer
      format: int64
      minimum: 1
      description: Revision number.
    Time:
      type: string
      format: date-time
      description: UTC, RFC 3339.
      examples: ["2026-11-10T09:00:03Z"]
    NullableTime:
      type: [string, "null"]
      format: date-time
    Risk:
      type: string
      enum: [read, reversible, disruptive, destructive]
      description: Risk class. The risk of a Plan is its highest change.
    Principal:
      type: string
      description: Who did something (provenance).
      pattern: "^(user|token|agent):.+$|^system$"
      examples: ["user:admin", "token:tok_ci", "agent:web1", system]
    NullablePrincipal:
      oneOf:
        - $ref: "#/components/schemas/Principal"
        - type: "null"

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          description: Field errors for 422. `pointer` is a JSON Pointer into the request body.
          items:
            type: object
            additionalProperties: false
            required: [pointer, message]
            properties:
              pointer: { type: string }
              message: { type: string }
        targets:
          type: array
          description: |
            Targets that use the secret, for `secret-in-use`. Targets whose agent is too old, for
            `agent-outdated`.
          items: { $ref: "#/components/schemas/Name" }
        missing:
          type: array
          description: |
            For `agent-outdated`: what the agents lack, `<type>` for a resource type,
            `<type>.<attr>` for an attribute, or `command:<name>` for a command (D-299: a disk
            grow of a VM needs `command:grow`), sorted, over all Targets in `targets`.
          items: { type: string, examples: ["unit", "file.acl", "command:grow"] }
        plans:
          type: array
          description: Pending Plans that use the secret, for `secret-in-use`.
          items: { $ref: "#/components/schemas/Id" }
        secrets:
          type: array
          description: Secret names, for `secret-conflict` and for a 422 about missing secrets.
          items: { $ref: "#/components/schemas/Name" }
    Page:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items: { type: array }
        next:
          type: [string, "null"]
          description: Cursor for the next page, `null` on the last page.

    Session:
      type: object
      additionalProperties: false
      required: [principal, must_change_password, tier, expires_at]
      properties:
        principal: { $ref: "#/components/schemas/Principal" }
        must_change_password: { type: boolean }
        tier:
          type: string
          enum: [read, plan, apply, admin]
          description: Effective tier. `admin` only for a human session; a token has the others.
        max_risk:
          type: string
          enum: [reversible, disruptive]
          description: Only for an `apply` token.
        expires_at:
          $ref: "#/components/schemas/NullableTime"
          description: Session expiry. `null` for a token without expiry.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    OneTimePassword:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, description: Shown once. }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024, format: password }
        new_password: { type: string, minLength: 12, maxLength: 1024, format: password }

    # Documents. The shapes live in internal/state/schema (D-043): the server validates
    # against the same files, so there is one source.
    Image:
      $ref: "../internal/state/schema/image.json"
    Block:
      $ref: "../internal/state/schema/block.json"
    Target:
      $ref: "../internal/state/schema/target.json"
    Rule:
      $ref: "../internal/state/schema/rule.json"
    Document:
      description: A document of the State (`kind`, `name`, `spec`).
      oneOf:
        - $ref: "#/components/schemas/Image"
        - $ref: "#/components/schemas/Block"
        - $ref: "#/components/schemas/Target"
        - $ref: "#/components/schemas/Rule"
    DocumentKind:
      type: string
      enum: [Image, Block, Target, Rule]
    DocumentRef:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        name: { $ref: "#/components/schemas/Name" }
    ImageView:
      type: object
      additionalProperties: false
      description: An Image of the head revision.
      required: [revision, document]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
          description: The revision that last changed this document.
        document: { $ref: "#/components/schemas/Image" }
        status:
          $ref: "#/components/schemas/ImageStatus"
          description: |
            Builds and versions of a built Image (D-198). Present for every `lxc` Image, also
            without `build`, for its `unused_imports` (D-233); without `build`, `versions` is empty.
            Missing for a stock `vm` Image.
    ImageStatus:
      type: object
      additionalProperties: false
      required: [versions, building, last_build, next_build_at, unused_imports]
      properties:
        versions:
          type: array
          description: Every version, newest first, also `failed` and `removed` ones.
          items: { $ref: "#/components/schemas/ImageVersion" }
        building:
          type: [integer, "null"]
          minimum: 1
          description: The version that a Run builds now, else `null`. One build per Image at a time.
        last_build:
          oneOf:
            - $ref: "#/components/schemas/ImageVersion"
            - type: "null"
          description: The newest finished build (`ready` or `failed`), else `null`.
        next_build_at:
          $ref: "#/components/schemas/NullableTime"
          description: The next slot of `schedule` (UTC), `null` without a schedule (D-210).
        unused_imports:
          type: array
          description: |
            Downloaded base images in the image storage that no checksum needs: not the checksum of
            the document and not the base of a running build. Safe to remove: no version needs it,
            because a version template is a full copy; a rollback to that checksum downloads it
            again (D-209). For an `lxc` Image: the repacked template files (`vztmpl`) whose name
            is not the current file of any `lxc` Image (pin, CA and agent URL), and that no container
            of the pool names in its description (D-233, D-250). Plumb never deletes them; a person
            runs `command` on the host. Empty when the driver cannot list the files or a current
            file is not known. A file can show as unused for a moment while a Run creates a
            container from an older revision; freeing it then fails that create, and a new Plan
            fetches it again.
          items: { $ref: "#/components/schemas/UnusedImport" }
        disk:
          $ref: "#/components/schemas/DiskUse"
          description: Use of the disk storage, when the driver could read it.
        left_templates:
          type: array
          description: |
            Build guests that were converted to a template but never named as a version (a
            conversion that ended after its error). Plumb never uses or removes them; a person
            removes them in Proxmox by `guest_id` (the VMID). Missing means none.
          items: { $ref: "#/components/schemas/LeftTemplate" }
    LeftTemplate:
      type: object
      additionalProperties: false
      required: [name, guest_id]
      properties:
        name: { type: string, examples: ["plumb-build-ubuntu-web-v4"] }
        guest_id: { type: string, description: Proxmox VMID. }
    ImageVersion:
      type: object
      additionalProperties: false
      description: One build of an Image (table `image_version`, D-198).
      required:
        - version
        - status
        - trigger
        - run_id
        - revision
        - recipe_sha256
        - base_sha256
        - disk_gb
        - started_at
        - finished_at
        - removed_at
        - targets
      properties:
        version: { type: integer, minimum: 1, description: "Counts up per Image name, never used again." }
        status:
          type: string
          enum: [building, ready, failed, removed]
        trigger: { $ref: "#/components/schemas/BuildTrigger" }
        run_id: { $ref: "#/components/schemas/Id" }
        revision:
          $ref: "#/components/schemas/Revision"
          description: The head revision that the Run rendered the recipe from.
        recipe_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        base_sha256:
          type: string
          pattern: "^([0-9a-f]{64}|[0-9a-f]{128})$"
          description: "SHA-256 of a vm base, SHA-512 pin of an lxc base (D-224, D-254)."
        disk_gb: { type: integer, minimum: 1 }
        started_at: { $ref: "#/components/schemas/Time" }
        finished_at: { $ref: "#/components/schemas/NullableTime" }
        removed_at: { $ref: "#/components/schemas/NullableTime" }
        targets:
          type: array
          description: Targets that were created from this version (D-200).
          items: { $ref: "#/components/schemas/Name" }
    BuildTrigger:
      type: string
      enum: [change, manual, schedule]
      description: |
        `change`: a Plan made or changed the recipe. `manual`: `POST /images/{name}/build`.
        `schedule`: the clock of `schedule`, planned and approved by `system` (D-199, D-201).
    UnusedImport:
      type: object
      additionalProperties: false
      required: [volume, size_bytes, command]
      properties:
        volume: { type: string, examples: ["plumb-images:import/plumb-ubuntu-web-3f1c0a9e5d6b.qcow2"] }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        command:
          type: string
          description: |
            The exact command for a person on the Proxmox host:
            `pvesm free <storage>:import/plumb-<image>-<12 hex>.qcow2` or
            `pvesm free <storage>:vztmpl/plumb-ct-<image>-<12 hex>.tar.gz`. Empty when the file
            does not have the name form of Plumb.
          examples: ["pvesm free plumb-images:import/plumb-ubuntu-web-3f1c0a9e5d6b.qcow2"]
    DiskUse:
      type: object
      additionalProperties: false
      description: |
        Real use of the disk storage of guests (D-203). A build does not start when
        `used_bytes + reserved_bytes + build disk` is more than `limit_percent` of `total_bytes`.
      required: [storage, total_bytes, used_bytes, reserved_bytes, limit_percent]
      properties:
        storage: { type: string }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Disks of the builds that run now.
        limit_percent: { type: integer, minimum: 1, maximum: 100 }
    BlockView:
      type: object
      additionalProperties: false
      description: A Block of the head revision.
      required: [revision, document]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
          description: The revision that last changed this document.
        document: { $ref: "#/components/schemas/Block" }
    RuleView:
      type: object
      additionalProperties: false
      description: A Rule of the head revision.
      required: [revision, document]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
          description: The revision that last changed this document.
        document: { $ref: "#/components/schemas/Rule" }
    TargetView:
      type: object
      additionalProperties: false
      description: A Target of the head revision plus its live status.
      required: [revision, document, status]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
          description: The revision that last changed this document.
        document: { $ref: "#/components/schemas/Target" }
        status: { $ref: "#/components/schemas/TargetStatus" }
        raw:
          type: array
          description: |
            The overrides of the Target as raw resources (D-301), sorted by `resource`. Empty when
            the Target has none. Missing on an older controller.
          items: { $ref: "#/components/schemas/RawResource" }
    TargetStatus:
      type: object
      additionalProperties: false
      description: Live status. It is not part of the desired state.
      required: [phase, agent, power, open_issues, waiting]
      properties:
        phase:
          type: string
          enum: [pending, provisioning, enrolling, ready, applying, drifted, stopped, restart_needed, error]
          description: |
            `pending`: no guest yet. `provisioning`: the driver creates it. `enrolling`: waiting
            for the agent. `ready`: matches the head revision. `applying`: a Run is active.
            `drifted`: open issues. `restart_needed`: no open issue, but `waiting` is not empty
            (D-195). `stopped`: the desired `guest.power` is `stopped`, the guest is stopped and no
            issue is open (D-299); its agent is offline on purpose. `error`: the last Run failed.
            The order of precedence is `provisioning`, `pending`, `applying`, `enrolling`, `error`,
            `drifted`, `stopped`, `restart_needed`, `ready`. A client that does not know `stopped`
            shows the word as it is.
            The phase is one word for a list; `waiting` is the truth and can be non-empty in
            every phase. An LXC Target never has `restart_needed`: cores and memory change live on
            a container.
        agent:
          type: string
          enum: [none, online, offline]
          description: "`online` when the agent polled in the last 90 s."
        power: { type: string, enum: [running, stopped, unknown] }
        last_seen: { $ref: "#/components/schemas/NullableTime" }
        agent_version:
          type: [string, "null"]
          maxLength: 64
          description: |
            Version of the agent from its last hello, also when it is offline now. `null` before
            the first hello. Missing on an older controller. Guest text: the controller keeps at
            most 64 bytes of printable ASCII.
          examples: ["v0.4.0"]
        agent_update:
          type: string
          enum: [none, available, required, manual, unknown]
          description: |
            Compares the agent's binary with the one this controller serves (D-257 … D-259).
            `none`: the same binary. `available`: another binary, and the agent can apply the
            desired state; `POST /targets/{name}/agent-update` proposes the update. `required`: the
            desired state needs something the agent lacks (`agent_missing`); every Plan for this
            Target is refused with `agent-outdated` until the update ran. `manual`: the agent is
            older than slice 3 and cannot update itself: run the one-time install in the guest by
            hand (ARCHITECTURE §14). `unknown`: no hello yet. Missing on an older controller.
        agent_missing:
          type: array
          description: |
            What the desired state needs and the agent lacks: `<type>` or `<type>.<attr>`, sorted.
            Empty when nothing is missing. Missing on an older controller. `command:grow` is not
            listed here (D-310): a disk grow of a VM checks it only at the Plan (409
            `agent-outdated`) and in the Run.
          items: { type: string }
        agent_reverted:
          oneOf:
            - $ref: "#/components/schemas/AgentRevert"
            - type: "null"
          description: |
            The last update failed in the guest and the agent went back to its old binary. `null`
            or missing when not. It stays until the next update command.
        guest_id:
          type: [string, "null"]
          description: Proxmox VMID.
        image_version:
          type: [integer, "null"]
          minimum: 1
          description: |
            The version of a built Image that the guest was cloned from (D-200), read from the guest
            description. `null` for a stock Image or when unknown. Information only: a new version
            changes no Target. Missing for a stock Image.
        ips:
          type: array
          description: |
            The address of the Proxmox config (D-079). It never holds a value that the guest chose
            (D-214), so a client may connect to it. Empty for a `dhcp` Target.
          items: { type: string }
        reported_ips:
          type: array
          description: |
            The addresses that the agent in the guest reports (D-212, D-214), "reported by the
            guest". For display only: root in the guest can send any list, so never use it to
            authorize or as a connect target (D-216). IPv4 first, then IPv6, sorted; at most 16; no
            loopback, link-local or multicast address. Empty when the agent is offline, when it
            reports no list (an old agent, D-217), or when the guest has no address. Missing on an
            older controller.
          maxItems: 16
          items: { type: string, examples: ["192.0.2.41", "2001:db8::41"] }
        reported_at:
          $ref: "#/components/schemas/NullableTime"
          description: |
            When the controller took the list in `reported_ips`. `null` when the list is unknown
            or the agent is offline; set when the list is known, also when it is empty.
        reported_ips_more:
          type: boolean
          description: |
            The guest has more than 16 addresses; `reported_ips` shows the first 16. Missing means
            `false`.
        applied_revision:
          type: [integer, "null"]
          description: Newest revision applied to this target.
        open_issues: { type: integer, minimum: 0 }
        last_run_id: { $ref: "#/components/schemas/NullableId" }
        ignored_drift:
          type: array
          description: |
            Drift that a rule dropped at intake and that is still there (D-092). Missing means
            none. It makes an ignore visible.
          items: { $ref: "#/components/schemas/IgnoredDrift" }
        waiting:
          type: array
          description: |
            Values of `cores` and `memory` that are set in Proxmox and wait for the next stop and
            start of the VM (D-195): the VM still runs with `from`. Always present; empty when
            nothing waits. A reboot inside the guest does not end it. It ends when the VM is
            stopped and started (outside Plumb, or by a Run when `allow_restart` is on), or when
            the desired value goes back to `from`. Always empty for an LXC Target yet.
          items: { $ref: "#/components/schemas/WaitingValue" }
    AgentRevert:
      type: object
      additionalProperties: false
      description: |
        An agent update that the guest rolled back (D-258). Reported by the guest and checked by
        the controller before it is stored (ARCHITECTURE §14); display only.
      required: [from, to, reason, at]
      properties:
        from: { type: string, maxLength: 64, description: "Version that runs again." }
        to: { type: string, maxLength: 64, description: "Version that failed." }
        reason:
          type: string
          enum: [crash-loop, no-hello]
          description: "`crash-loop`: the new binary did not stay up. `no-hello`: it ran but had no successful hello within 5 minutes."
        at: { $ref: "#/components/schemas/Time" }
    WaitingValue:
      type: object
      additionalProperties: false
      required: [attr, from, to, since]
      properties:
        attr: { type: string, enum: [cores, memory] }
        from: { type: integer, description: The value that the VM uses now. }
        to: { type: integer, description: "The desired value: set in Proxmox, not active yet." }
        since:
          $ref: "#/components/schemas/Time"
          description: |
            When Plumb first saw this value wait. For a value from before the upgrade to
            migration 0007 it is "since at least".
    IgnoredDrift:
      type: object
      additionalProperties: false
      required: [resource, rule, attrs, last_seen]
      properties:
        resource: { type: string, examples: ["file:/etc/motd"] }
        rule:
          $ref: "#/components/schemas/Name"
          description: The Rule that dropped it.
        attrs:
          type: array
          description: The attributes that differ. No values.
          items: { type: string }
        last_seen: { $ref: "#/components/schemas/Time" }

    Proposal:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        put:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        delete:
          type: array
          items: { $ref: "#/components/schemas/DocumentRef" }
        targets:
          type: array
          description: |
            Targets to plan also when their documents do not change. Use it to send a new secret
            value to the targets of `SecretInfo.used_by` (D-090).
          items: { $ref: "#/components/schemas/Name" }
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 2000 }

    Change:
      description: |
        One attribute change, the same as `wire.Change` (D-047). `from` is the guest now, `to`
        is the desired state; a missing value means "not there". A sensitive change has no
        values (D-037).
      oneOf:
        - type: object
          required: [attr, risk]
          properties:
            attr: { type: string }
            from: { description: The value in the guest now. Missing when not there. }
            to: { description: The desired value. Missing when it must not be there. }
            risk: { $ref: "#/components/schemas/Risk" }
            ignored: { $ref: "#/components/schemas/IgnoredFlag" }
            pending:
              type: boolean
              description: |
                Only on `guest:config` (D-190): `from` is set in Proxmox but not active. The VM
                uses `to`; `from` becomes active at the next stop and start of the VM. Missing
                means `false`. For display only.
            also_pending:
              description: |
                Only on `guest:config` (D-190): `from` is the running value, and this other value
                is set in Proxmox and waits for the next stop and start. For display only.
            waits_for_restart:
              type: boolean
              description: |
                Only on `guest:config` (D-194, D-195): `to` is or will be set in Proxmox and
                becomes active at the next stop and start of the VM. A Run step with this change
                is `applied`, but the value is not active yet. Missing means `false`. For display
                only.
          additionalProperties: false
        - type: object
          required: [attr, sensitive, risk]
          properties:
            attr: { type: string }
            sensitive: { const: true }
            risk: { $ref: "#/components/schemas/Risk" }
            ignored: { $ref: "#/components/schemas/IgnoredFlag" }
          additionalProperties: false
    # T-025 question 1 (open): today a rule hides the Issue only, and a Plan still shows and
    # applies the difference with this flag. If a rule must also stop the apply, this flag
    # changes its meaning to "not applied"; no other shape changes.
    IgnoredFlag:
      type: boolean
      description: |
        Only in a Plan: a Rule ignores this drift (D-092). The Plan still shows the change, and
        an apply still overwrites it. Missing means `false`.
    Action:
      type: string
      enum: [create, update, delete, restart]
      description: Derived from the changes by `wire.ActionOf`.

    PlanStatus:
      type: string
      enum: [pending, approved, stale]
      description: |
        `pending`: waits for approval. `approved`: revision committed, Run started (its status is
        the result). `stale`: the head moved before approval.
    Plan:
      type: object
      additionalProperties: false
      required:
        - id
        - origin
        - issue_id
        - status
        - risk
        - reason
        - author
        - created_at
        - base_revision
        - approved_by
        - approved_at
        - revision
        - run_id
        - targets
        - warnings
      properties:
        id: { $ref: "#/components/schemas/Id" }
        origin:
          type: string
          enum: [proposal, revert, accept, reenroll, rollback, import, ignore_rule, build, agent_update]
          description: |
            What made the Plan. `build`: a manual or scheduled image build with no document
            change (D-199). `agent_update`: replaces the agent binary of one Target, no document
            change (D-257).
        issue_id:
          $ref: "#/components/schemas/NullableId"
          description: The issue, for `revert`, `accept` and `ignore_rule`.
        rollback_to:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: |
            The revision `n` of `POST /revisions/{n}/rollback` (D-131). Set when `origin` is
            `rollback`; missing or `null` for every other origin. The server sets it; no request
            can send it. The Plan was built against `base_revision`, so the revision that an
            approval commits has the same documents as revision `rollback_to`.
        status: { $ref: "#/components/schemas/PlanStatus" }
        risk: { $ref: "#/components/schemas/Risk" }
        reason: { type: string }
        author: { $ref: "#/components/schemas/Principal" }
        created_at: { $ref: "#/components/schemas/Time" }
        base_revision:
          type: [integer, "null"]
          description: Head revision when the Plan was made. `null` for an empty state.
        approved_by: { $ref: "#/components/schemas/NullablePrincipal" }
        approved_at: { $ref: "#/components/schemas/NullableTime" }
        revision:
          type: [integer, "null"]
          description: |
            The committed revision, after approval. Always `null` for origin `build` and
            `agent_update`.
        run_id: { $ref: "#/components/schemas/NullableId" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/TargetPlan" }
        warnings:
          type: array
          description: |
            For example "cannot detect drift" for a `command` resource, or the names of the
            secrets that an import wrote.
          items: { type: string }
        human_only:
          type: array
          description: |
            Reasons why only a human session can approve this Plan (D-099). Missing or empty for
            a normal Plan. `secret-binding`: a target and resource gets a secret that it did not
            get in the base revision. `rule-change`: the Plan puts, changes or deletes a Rule.
            `image-recipe`: the Plan makes or deletes a built Image, or changes its recipe,
            `schedule` or `retention`, also through a changed Block (D-201).
            `accept-guest-data`: the Plan was made by an Accept of an Issue (origin `accept`) and
            adopts values that a guest reported (D-323).
            The server computes it from the content of the proposal, for every origin, and from
            the origin for `accept-guest-data`; no client field sets or clears it.
          items:
            type: string
            enum: [secret-binding, rule-change, image-recipe, accept-guest-data]
        images:
          type: array
          description: |
            Image builds and template removals of this Plan (D-199, D-209). Missing means none.
          items: { $ref: "#/components/schemas/ImagePlan" }
    ImagePlan:
      type: object
      additionalProperties: false
      required: [image, removes]
      properties:
        image: { $ref: "#/components/schemas/Name" }
        build:
          $ref: "#/components/schemas/ImageBuildPlan"
          description: Missing when the Plan only removes templates (lower `keep`, Image delete).
        notes:
          type: array
          description: |
            What the person who approves must know about the disk storage of this build, for
            example "thin-pool metadata use is unknown" or that the build would not start now.
            Missing means none. A scheduled build records them in its Run.
          items: { type: string }
        removes:
          type: array
          description: |
            Templates that the retention step removes when the Run succeeds (D-209). A removal
            runs only after the new version is `ready`.
          items: { $ref: "#/components/schemas/ImageRemoval" }
        disk: { $ref: "#/components/schemas/DiskUse" }
    ImageBuildPlan:
      type: object
      additionalProperties: false
      required: [version, trigger, upgrade, recipe_sha256, resources]
      properties:
        version:
          type: integer
          minimum: 1
          description: The next free number when the Plan was made. The Run can get a higher one.
        trigger: { $ref: "#/components/schemas/BuildTrigger" }
        upgrade: { type: boolean }
        recipe_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The recipe that `resources` show. Approval needs the same recipe at the head.
        resources:
          type: array
          description: The resources of the build guest. All are `create` and `unverified`.
          items: { $ref: "#/components/schemas/ResourcePlan" }
    ImageRemoval:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [version, base]
          description: "`version`: a built version. `base`: a stock template with another checksum."
        name: { type: string, examples: ["plumb-img-ubuntu-web-v1"] }
        version: { type: [integer, "null"], minimum: 1 }
    PlannedSecret:
      type: object
      additionalProperties: false
      description: A secret that a target gets, with the version that the Plan was made with.
      required: [name, version]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        version: { type: integer, format: int64, minimum: 1 }
    TargetPlan:
      type: object
      additionalProperties: false
      required: [target, resources]
      properties:
        target: { $ref: "#/components/schemas/Name" }
        secrets:
          type: array
          description: |
            The secrets that the desired state of this target uses (D-089). Missing means none.
            The Plan is stale when one of them has another version or is gone.
          items: { $ref: "#/components/schemas/PlannedSecret" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/ResourcePlan" }
    ResourcePlan:
      type: object
      additionalProperties: false
      required: [resource, action, risk, changes]
      properties:
        resource:
          type: string
          description: |
            Resource id `type:key`. `guest:config` is the Proxmox settings. `agent:binary` is the
            agent update step (D-257): one change `{attr: version, from, to}`, risk `disruptive`.
          examples: ["file:/etc/motd", "guest:config", "agent:binary"]
        action: { $ref: "#/components/schemas/Action" }
        risk: { $ref: "#/components/schemas/Risk" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        unverified:
          type: boolean
          description: |
            A resource of a new target, or a resource of an existing target that gets a new secret
            binding (D-156). Nobody observed it, so `changes` is empty, except one
            `{attr, sensitive, risk}` per attribute that gets a secret (D-089, D-133); it is
            verified at the first apply (D-066, D-075).
        after:
          type: array
          description: |
            Apply order (D-167, D-171): the resource ids that this resource comes after. Missing
            means none. The Block of the resource names them in `spec.after`. The resource and the
            rest of its Block use start only when each named resource ended `unchanged` or
            `applied`; else they are `skipped`. A named resource can be absent from this Plan: then
            it has no change, and the order still holds.
          uniqueItems: true
          items: { type: string }
          examples: [["package:nginx"]]
        restart_by:
          type: array
          description: |
            Only for a service with a planned `restart` change (D-171): the resource ids from its
            `restart_on` list that cause the restart, in list order. They change in this Plan, or
            nobody observed them (D-156). Missing means the Plan does not name a cause. It is for
            display only; the apply does not use it.
          uniqueItems: true
          items: { type: string }
          examples: [["file:/etc/nginx/sites-available/a", "symlink:/etc/nginx/sites-enabled/a"]]
        confirm_seconds:
          type: integer
          const: 90
          description: |
            Safe apply (D-293, D-300), only for a `firewall` resource with a change: after the
            change the agent needs a fresh round trip to the controller within this many seconds;
            else it puts the confirmed state back and the step is `failed` with `rolled_back`.
            Missing for every other resource.
        summary:
          type: array
          description: |
            Lines for the person who approves, derived from the desired attributes (D-300). For
            `firewall`: the effective SSH rule, for example "SSH tcp/22 open from everywhere",
            "SSH tcp/2222 open from 192.0.2.0/24" or "no SSH rule (allow_no_ssh)", then the policy.
            Missing when there is nothing to say. Display only.
          maxItems: 8
          items: { type: string, maxLength: 200 }
          examples: [["SSH tcp/22 open from everywhere", "policy drop: other input is dropped"]]

    RunStatus:
      type: string
      enum: [running, succeeded, failed]
    StepStatus:
      type: string
      enum: [pending, running, unchanged, applied, failed, refused, skipped]
      description: |
        `refused`: the difference is not in the approved Plan, or a change was above the approved
        risk; nothing of the resource was applied. `skipped`: not applied, because an earlier
        resource of the same Block use, or a resource that it comes after (`ResourcePlan.after`),
        did not end `unchanged` or `applied`, or because the apply ended first. `output` names the
        cause (D-170).
        `failed` with an `output` that starts with "update the agent first": the Run start found
        that the Target's agent lacks a resource type or attribute (D-259); no command went to
        that Target. An agent can change between approval and start (a guest restored from an old
        backup).
    Run:
      type: object
      additionalProperties: false
      description: A Run starts at approval. Who approved is on the Plan.
      required: [id, plan_id, revision, status, started_at, finished_at, waits_for_restart, targets]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        plan_id: { $ref: "#/components/schemas/Id" }
        revision: { $ref: "#/components/schemas/Revision" }
        status: { $ref: "#/components/schemas/RunStatus" }
        started_at: { $ref: "#/components/schemas/Time" }
        finished_at: { $ref: "#/components/schemas/NullableTime" }
        waits_for_restart:
          type: integer
          minimum: 0
          description: |
            The number of changes that the steps of this Run recorded with `waits_for_restart`
            (D-195): written, but not active until the next stop and start of the VM. A Run can
            be `succeeded` with a number above 0. Set when the Run ends; 0 while it runs.
        targets:
          type: array
          items: { $ref: "#/components/schemas/TargetRun" }
        images:
          type: array
          description: Image builds of this Run (D-199). Missing means none.
          items: { $ref: "#/components/schemas/ImageRun" }
    ImageRun:
      type: object
      additionalProperties: false
      description: |
        One build lane. Steps in this order: `image:base`, `guest:config`, the resources of the
        recipe, `image:seal`, `image:template`, `image:retention` (D-199).
      required: [image, version, trigger, status, steps]
      properties:
        image: { $ref: "#/components/schemas/Name" }
        version: { type: integer, minimum: 1 }
        trigger: { $ref: "#/components/schemas/BuildTrigger" }
        status: { $ref: "#/components/schemas/RunStatus" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RunStep" }
    TargetRun:
      type: object
      additionalProperties: false
      required: [target, status, steps]
      properties:
        target: { $ref: "#/components/schemas/Name" }
        status: { $ref: "#/components/schemas/RunStatus" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RunStep" }
    RunStep:
      type: object
      additionalProperties: false
      required: [resource, action, status, changes, output, started_at, finished_at]
      properties:
        resource: { type: string }
        action:
          oneOf:
            - $ref: "#/components/schemas/Action"
            - type: "null"
          description: "`null` when `changes` is empty (`wire.ActionNone`)."
        status: { $ref: "#/components/schemas/StepStatus" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        output:
          type: string
          description: Short output of the agent or driver, `""` when empty. Untrusted; the UI escapes it.
        rolled_back:
          type: boolean
          description: |
            Only with `failed`: a safe apply (D-300) changed the resource, got no round trip to the
            controller within `confirm_seconds`, and put the confirmed state back. The guest has the
            state from before the Run. Missing means `false`.
        started_at: { $ref: "#/components/schemas/NullableTime" }
        finished_at: { $ref: "#/components/schemas/NullableTime" }

    IssueStatus:
      type: string
      enum: [open, resolving, resolved]
    IssueAction:
      type: string
      enum: [accept, revert, ignore_once, ignore_rule]
      description: |
        `accept` and `revert` (D-068), `ignore_once` (D-091), `ignore_rule` (D-092). See
        `POST /issues/{id}/resolve` for who may use them. An Issue on `guest:address` offers
        only `ignore_once` and `ignore_rule` (D-215).
    Issue:
      type: object
      additionalProperties: false
      description: |
        Drift of one resource on one target. Drift on `guest:config` comes from Proxmox, all
        other drift from the agent.

        `guest:address` (D-215): a Target with a static `ip` whose agent has not reported that
        address for 2 minutes. The Proxmox config is right; the guest does not use it. It has one
        change `{attr: ip, from: [the reported list], to: "<configured address>", risk: read}`.
        `actions` are `ignore_once` and `ignore_rule` only: `ip` is create-only (D-185), so
        `accept` and `revert` get 409. It is resolved as `gone` by `system` when the address has
        been in the reported list for 2 minutes. A new mismatch within 1 hour after that opens
        the same Issue again.

        `guest:config` with slice 4 settings (D-299): `power` (someone started or stopped the
        guest in Proxmox), `tags` (someone changed the tags) and `disk` (someone grew the disk in
        Proxmox). For a disk that is bigger than desired, `revert` is not in `actions` (Proxmox
        cannot shrink): `accept` takes the bigger size into the Target, or ignore it.

        After a restore (D-290, D-303), `system` opens two kinds. `guest:missing`: the Target is
        bound to a guest that Proxmox no longer has (it was deleted after the backup). One change
        `{attr: guest_id, from: null, to: "<the bound VMID>", risk: destructive}`. Plumb never
        makes the guest again by itself: delete the Target, or delete and add it again by a
        Plan. `agent:silent`: the guest exists and runs, but its agent sent no hello in the 10
        minutes after the confirm (its agent may have enrolled again after the backup, so its
        credential is unknown). One change `{attr: hello, from: null, to: "any", risk: read}`; use
        `POST /targets/{name}/reenroll`. Both offer only `ignore_once` and `ignore_rule`, and
        `system` resolves them as `gone` when the guest or the hello comes back, or when an
        applied Plan deletes the Target (then with the system comment "Resolved: the Target was
        deleted."; a foreign guest stays and is never deleted, D-322).
      required:
        - id
        - target
        - resource
        - status
        - risk
        - opened_at
        - updated_at
        - changes
        - actions
        - plan_id
        - resolution
        - comments
      properties:
        id: { $ref: "#/components/schemas/Id" }
        target: { $ref: "#/components/schemas/Name" }
        resource: { type: string, examples: ["file:/etc/motd", "guest:config", "guest:address"] }
        status: { $ref: "#/components/schemas/IssueStatus" }
        risk:
          $ref: "#/components/schemas/Risk"
          description: Risk of a revert (the highest risk in `changes`).
        opened_at: { $ref: "#/components/schemas/Time" }
        updated_at: { $ref: "#/components/schemas/Time" }
        changes:
          type: array
          description: "`from` = the guest now (the drift), `to` = the desired state."
          items: { $ref: "#/components/schemas/Change" }
        actions:
          type: array
          description: Actions allowed now. `accept` is missing for a sensitive change.
          items: { $ref: "#/components/schemas/IssueAction" }
        plan_id:
          $ref: "#/components/schemas/NullableId"
          description: The Plan that resolves it (`accept`, `revert`, `ignore_rule`).
        resolution:
          oneOf:
            - $ref: "#/components/schemas/Resolution"
            - type: "null"
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        raw:
          type: boolean
          description: |
            Raw mode offer (D-296, D-301). `true` when a Block renders the resource (`source` is
            set) and `accept` is in `actions`: Accept then fixes the observed values as an override
            of this Target ("Accept as raw for this Target"); the Block and its parameters do not
            change, and the resource no longer follows them for these attributes until "Back to the
            Block" (`TargetView.raw`). `false` for `guest:*` (Accept writes the Proxmox settings of
            the Target). Missing on an older controller.
        source:
          $ref: "#/components/schemas/ResourceSource"
    ResourceSource:
      type: [object, "null"]
      additionalProperties: false
      description: |
        The Block use that renders the resource (D-301): `block` is the Block document, `use` the
        id of the use in `spec.blocks` (default the Block name). `null` for `guest:*` and
        `agent:*`. Missing on an older controller.
      required: [block, use]
      properties:
        block: { $ref: "#/components/schemas/Name" }
        use: { $ref: "#/components/schemas/Name" }
    RawResource:
      type: object
      additionalProperties: false
      description: |
        One entry of `spec.overrides` of the Target, shown as a resource in raw mode (D-296,
        D-301). The editor changes `spec.overrides[resource]` by a normal proposal (`POST /plans`
        with the Target in `put`); "Back to the Block" is a proposal without this key. Both go
        through a Plan that shows the change. An override never holds a secret reference, and the
        key attribute of the resource cannot be overridden (render refuses both).
      required: [resource, attrs, source]
      properties:
        resource: { type: string, examples: ["file:/etc/nginx/nginx.conf", "guest:config"] }
        attrs:
          type: array
          description: The attributes that the override fixes, sorted. Names only; the values are in the document.
          items: { type: string }
        source:
          $ref: "#/components/schemas/ResourceSource"
    Resolution:
      type: object
      additionalProperties: false
      required: [action, by, at]
      properties:
        action:
          type: string
          enum: [accept, revert, gone, ignore]
          description: |
            `gone`: the drift went away by itself; `by` is `system`. `ignore`: by `ignore_once`
            or by a Rule.
        by: { $ref: "#/components/schemas/Principal" }
        at: { $ref: "#/components/schemas/Time" }
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/IssueAction" }
        reason: { type: string, maxLength: 2000 }
        rule:
          type: object
          description: Only for `ignore_rule`. The scope of the new Rule. The server names it.
          additionalProperties: false
          properties:
            all_targets:
              type: boolean
              default: false
              description: "`true`: the rule is for every target (`target: \"*\"`). Default: the target of the issue."
            attrs:
              type: array
              minItems: 1
              maxItems: 50
              uniqueItems: true
              description: Attributes to ignore. Default is every attribute of the resource.
              items: { type: string, minLength: 1, maxLength: 100 }
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, body, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Principal" }
        body: { type: string, description: Plain text. The UI escapes it. }
        created_at: { $ref: "#/components/schemas/Time" }
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    RevisionInfo:
      type: object
      additionalProperties: false
      description: One committed revision (provenance, D-008).
      required: [id, author, reason, plan_id, created_at, documents]
      properties:
        id: { $ref: "#/components/schemas/Revision" }
        author:
          $ref: "#/components/schemas/Principal"
          description: |
            The author of the Plan that made this revision (D-128). The approver is
            `approved_by` of that Plan.
        reason: { type: string }
        plan_id:
          $ref: "#/components/schemas/NullableId"
          description: The Plan that made it. `null` for a seeded revision.
        created_at: { $ref: "#/components/schemas/Time" }
        documents:
          type: integer
          minimum: 0
          description: Number of documents in the revision.
    RevisionDiff:
      type: object
      additionalProperties: false
      required: [from, to, changes]
      properties:
        from:
          type: [integer, "null"]
          description: The base revision. `null` is the empty state (before revision 1).
        to: { $ref: "#/components/schemas/Revision" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/DocumentChange" }
    DocumentChange:
      type: object
      additionalProperties: false
      required: [kind, name, op, before, after]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        name: { $ref: "#/components/schemas/Name" }
        op:
          type: string
          enum: [added, changed, removed]
        before:
          description: The document in `from`. `null` for `added`.
          oneOf:
            - $ref: "#/components/schemas/Document"
            - type: "null"
        after:
          description: The document in `to`. `null` for `removed`.
          oneOf:
            - $ref: "#/components/schemas/Document"
            - type: "null"

    SecretInfo:
      type: object
      description: Metadata of a secret. There is no schema with a readable secret value.
      required: [name, version, updated_by, updated_at, used_by]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/Name" }
        version:
          type: integer
          format: int64
          minimum: 1
          description: |
            Changes with every write. It comes from one counter for all secrets, so it is not a
            count of the writes of this secret (D-087).
        updated_by: { $ref: "#/components/schemas/Principal" }
        updated_at: { $ref: "#/components/schemas/Time" }
        used_by:
          type: array
          description: Targets of the head revision that refer to the secret.
          items: { $ref: "#/components/schemas/Name" }
    SecretValue:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 65536
          description: UTF-8 text, at most 65536 bytes. Plumb never returns it.

    Tier:
      type: string
      enum: [read, plan, apply]
      description: Token tier (D-046).
    Token:
      type: object
      description: An API token without its bearer value.
      required: [id, name, tier, max_risk, created_by, created_at, last_used_at, revoked_at]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public part of the token. Its principal is `token:<id>`.
          examples: [tok_ci]
        name: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        max_risk:
          type: [string, "null"]
          enum: [reversible, disruptive, null]
          description: Only for tier `apply`; `null` for the other tiers.
        created_by: { $ref: "#/components/schemas/Principal" }
        created_at: { $ref: "#/components/schemas/Time" }
        last_used_at: { $ref: "#/components/schemas/NullableTime" }
        revoked_at: { $ref: "#/components/schemas/NullableTime" }
        disabled_at:
          $ref: "#/components/schemas/NullableTime"
          description: |
            A restore disabled the token (D-303): it gets 401 until a person enables it
            (`POST /tokens/{id}/enable`). `null` when enabled. Missing on an older controller.
    TokenRequest:
      type: object
      required: [name, tier]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        tier: { $ref: "#/components/schemas/Tier" }
        max_risk:
          type: string
          enum: [reversible, disruptive]
          description: Required for tier `apply`, not allowed for the other tiers (422).
    TokenCreated:
      type: object
      required: [token, bearer]
      additionalProperties: false
      properties:
        token: { $ref: "#/components/schemas/Token" }
        bearer:
          type: string
          description: The bearer value `<id>.<secret>`. Shown once; Plumb stores only a hash.

    ExportRequest:
      type: object
      required: [passphrase]
      additionalProperties: false
      properties:
        passphrase:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
    ImportRequest:
      type: object
      required: [content, reason]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8388608
          description: "The text of an export file (YAML stream, `format: 1`)."
        mode:
          type: string
          enum: [replace, merge]
          default: replace
          description: "`replace`: documents that are not in the file are deleted. `merge`: only put."
        passphrase:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: Opens the `SecretBundle` of the file. Without it no secret is written.
        overwrite:
          type: array
          description: |
            Names of existing secrets that the import may replace with the value of the bundle.
            Default: none (D-095).
          items: { $ref: "#/components/schemas/Name" }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    BackupList:
      type: object
      additionalProperties: false
      required: [schedule, running, last_run, items, copy]
      properties:
        schedule:
          type: object
          additionalProperties: false
          required: [time, keep]
          description: Set by the installer (`--backup-time`, `--backup-keep`); no API changes it.
          properties:
            time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Daily, UTC." }
            keep: { type: integer, minimum: 1, maximum: 90, description: "Backups kept, scheduled and manual together." }
        running: { type: boolean }
        last_run:
          oneOf:
            - $ref: "#/components/schemas/BackupRun"
            - type: "null"
        items:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
        copy: { $ref: "#/components/schemas/BackupCopy" }
    Backup:
      type: object
      additionalProperties: false
      required: [name, created_at, size, sha256]
      properties:
        name: { type: string, pattern: "^plumb-[0-9]{8}T[0-9]{6}Z(-[0-9]{1,3})?\\.pbk$", examples: ["plumb-20261113T030000Z.pbk"] }
        created_at:
          $ref: "#/components/schemas/Time"
          description: |
            When the file was written (its modification time, UTC). The name holds the start time
            of the backup; after a clock change the two can differ. The list and the retention go by
            the order in which the backups were made, not by either time.
        size: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    BackupRun:
      type: object
      additionalProperties: false
      required: [started_at, finished_at, result, by, name, message]
      properties:
        started_at: { $ref: "#/components/schemas/Time" }
        finished_at: { $ref: "#/components/schemas/NullableTime" }
        result: { type: string, enum: [running, ok, failed] }
        by: { $ref: "#/components/schemas/Principal" }
        name: { type: [string, "null"], description: "The file, when it was written." }
        message: { type: string, description: "Short reason of a failure, \"\" else." }
    BackupCopy:
      type: object
      additionalProperties: false
      description: |
        State of the off-host copy by the host timer (D-289), read from the status file that the
        timer puts into the container. `none`: no timer (the install has no `--backup-storage`) or
        no run yet. `ok`: the last run copied `name`. `failed`: the last run failed, `message`
        says why (for example the storage is not mounted). `stale`: the last successful copy is
        older than 36 hours.
      required: [state, at, name, storage, message]
      properties:
        state: { type: string, enum: [none, ok, failed, stale] }
        at: { $ref: "#/components/schemas/NullableTime" }
        name: { type: [string, "null"] }
        storage: { type: [string, "null"] }
        message: { type: string, maxLength: 512 }
    RestoreState:
      type: object
      additionalProperties: false
      required: [restored, restored_mode]
      properties:
        restored: { type: boolean, description: This controller came from `plumb restore`. }
        restored_mode:
          type: boolean
          description: "`true` until `POST /restore/confirm` (D-303)."
        backup_created_at:
          $ref: "#/components/schemas/Time"
          description: When the backup was written. Changes after it are lost; secrets have their old values.
        restored_at: { $ref: "#/components/schemas/Time" }
        confirmed_at: { $ref: "#/components/schemas/NullableTime" }
        confirmed_by: { $ref: "#/components/schemas/NullablePrincipal" }
        disabled_tokens:
          type: integer
          minimum: 0
          description: Tokens that the restore disabled and nobody enabled yet.
        locked_users:
          type: array
          description: |
            Names of the users that the restore locked and nobody gave a new password yet, sorted.
            `POST /users/{name}/password` gives one a one-time password (D-321).
          items: { type: string }
          example: [alice, bob]
        unknown_guests:
          type: array
          description: |
            Guests in the Plumb pool that no Target or Image of the restored state is bound to
            (made after the backup). Plumb never changes or deletes them (D-290). Read every 60 s.
          items: { $ref: "#/components/schemas/UnknownGuest" }
    UnknownGuest:
      type: object
      additionalProperties: false
      required: [guest_id, name, type, template]
      properties:
        guest_id: { type: string, description: Proxmox VMID. }
        name: { type: string, maxLength: 128 }
        type: { type: string, enum: [vm, lxc] }
        template: { type: boolean }
    RestoreConfirm:
      type: object
      additionalProperties: false
      required: [old_controller_off]
      properties:
        old_controller_off:
          const: true
          description: The person states that the controller of the backup no longer runs.
        reason: { type: string, maxLength: 2000 }
    Event:
      type: object
      additionalProperties: false
      description: |
        One entry of the append-only event log. `target.addrs`: the address list that the agent
        of a Target reports changed (D-214); `data` holds no address, read the Target.
      required: [seq, type, time, subject, actor, data]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        type:
          type: string
          enum:
            - plan.created
            - plan.approved
            - plan.stale
            - run.started
            - run.step
            - run.finished
            - issue.opened
            - issue.updated
            - issue.resolved
            - target.status
            - target.addrs
            - revision.committed
            - token.created
            - token.revoked
            - secret.updated
            - secret.deleted
            - image.version
            - backup.finished
            - restore.confirmed
            - token.enabled
            - user.password_reset
        time: { $ref: "#/components/schemas/Time" }
        subject:
          type: string
          pattern: "^(plan|run|issue|target|revision|token|secret|image|backup|restore|user):.+$"
          description: |
            `<kind>:<id or name>`, for example `plan:12` or `target:web1`. `image.version` (subject
            `image:<name>`): a version of the Image changed its status. `backup.finished` (subject
            `backup:<file name>`, data `{result: ok|failed}`) and `restore.confirmed` (subject
            `restore:1`) are D-302, D-303. `user.password_reset` (subject `user:<name>`) is D-321.
          examples: ["plan:12", "target:web1"]
        actor: { $ref: "#/components/schemas/Principal" }
        data:
          type: object
          description: Small payload. Read the object for full details.
