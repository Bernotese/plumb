  /blocks:
    get:
      tags: [blocks]
      operationId: listBlocks
      summary: List blocks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of blocks from the head revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BlockView" }
              example:
                items:
                  - revision: 7
                    document:
                      kind: Block
                      name: deploy-user
                      spec:
                        description: A user for deployments with an SSH key.
                        params:
                          type: object
                          required: [ssh_key]
                          properties:
                            name: { type: string, default: deploy }
                            ssh_key: { type: string }
                        resources:
                          - user:
                              name: "{{ .name }}"
                              shell: /bin/bash
                              ssh_keys: ["{{ .ssh_key }}"]
                  - revision: 7
                    document:
                      kind: Block
                      name: motd
                      spec:
                        description: Message of the day.
                        params:
                          type: object
                          properties:
                            text: { type: string, title: Message, default: Managed by Plumb. }
                        resources:
                          - file: { path: /etc/motd, content: "{{ .text }}\n", mode: "0644" }
                  - revision: 7
                    document:
                      kind: Block
                      name: web-app
                      spec:
                        title: Web app
                        description: An nginx site in front of an app port.
                        params:
                          type: object
                          required: [server_names]
                          properties:
                            server_names:
                              type: array
                              title: Server names
                              items: { type: string }
                              minItems: 1
                            port: { type: integer, title: App port, default: 8080, minimum: 1, maximum: 65535 }
                            tls: { type: boolean, title: Serve HTTPS, default: false }
                            log_level: { type: string, title: Log level, enum: [error, warn, info], default: warn }
                            extra_config:
                              type: string
                              title: Extra nginx config
                              contentMediaType: text/plain
                              default: ""
                        resources:
                          - package: { name: nginx }
                          - file: { path: /etc/nginx/sites-enabled/app.conf, content: "server_name {{ .server_names }};\n" }
                          - service: { name: nginx, restart_on: ["file:/etc/nginx/sites-enabled/app.conf"] }
                next: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /blocks/{name}:
    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [blocks]
      operationId: getBlock
      summary: Read one block
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockView" }
              example:
                revision: 7
                document:
                  kind: Block
                  name: motd
                  spec:
                    description: Message of the day.
                    params:
                      type: object
                      properties:
                        text: { type: string, default: Managed by Plumb. }
                    resources:
                      - file: { path: /etc/motd, content: "{{ .text }}\n", mode: "0644" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /targets:
