        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
            example: { passphrase: "<a passphrase of 12 or more characters>" }
      responses:
        "200":
          description: The export file with the secret bundle.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/yaml:
              schema: { type: string }
              example: |
                kind: Export
                format: 1
                revision: 7
                exported_at: "2026-11-10T09:30:00Z"
                version: 0.2.0
                secrets: [app-db]
                ---
                kind: Target
                name: web1
                spec:
                  type: vm
                  image: ubuntu-26.04
                  guest: {cores: 2, memory: 2048, disk: 20, bridge: vmbr0, ip: dhcp}
                  blocks:
                    - {use: app, params: {db_password: {secret: app-db}}}
                  overrides: {}
                ---
                kind: SecretBundle
