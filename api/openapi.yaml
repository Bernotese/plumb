    parameters:
      - $ref: "#/components/parameters/DocName"
    get:
      tags: [images]
      operationId: getImage
      summary: Read one image
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageView" }
              example:
                revision: 7
                document:
                  kind: Image
                  name: debian-13
                  spec:
                    title: Debian 13 (trixie)
                    type: vm
                    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
                    sha256: 9a8b7c6d5e4f30211203f4e5d6c7b8a99a8b7c6d5e4f30211203f4e5d6c7b8a9
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /images/{name}/build:
    parameters:
      - $ref: "#/components/parameters/DocName"
    post:
      tags: [images]
      operationId: buildImage
      summary: Propose a build of an image
      description: |
        Creates a Plan of origin `build` (trigger `manual`) that builds a new version of a built
        Image from the recipe of the head revision (D-199). The Plan changes no document, and its
        approval commits no revision (`Plan.revision` stays `null`). It is stale when the recipe at
        the head differs at approval; a head change that leaves the recipe alone does not make it
        stale. A human session or an `apply` token approves it (D-201). A second build of the same
        Image is refused at approval with 409 `build-running`. An Image without `build` (a stock
        Image) returns 422.
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
            example: { reason: Fresh packages before the new web servers. }
      responses:
        "201":
          description: The Plan.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 21
                origin: build
                issue_id: null
                status: pending
                risk: reversible
                reason: Fresh packages before the new web servers.
                author: "user:admin"
                created_at: "2026-11-12T08:00:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets: []
                images:
                  - image: ubuntu-web
                    build:
                      version: 4
                      trigger: manual
                      upgrade: true
                      recipe_sha256: 5e0c1d2b3a4f5e6d7c8b9a0f1e2d3c4b5a6f7e8d9c0b1a2f3e4d5c6b7a8f9e0d
                      resources:
                        - resource: "package:nginx"
                          action: create
                          risk: reversible
                          changes: []
                          unverified: true
                        - resource: "service:nginx"
                          action: create
                          risk: reversible
                          changes: []
                          unverified: true
                    removes: []
                    disk:
                      storage: local-lvm
                      total_bytes: 45559136256
                      used_bytes: 9663676416
                      reserved_bytes: 0
                      limit_percent: 85
                warnings: []
