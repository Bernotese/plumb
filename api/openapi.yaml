  /issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [issues]
      operationId: getIssue
      summary: Read one issue
      responses:
        "200":
          description: The Issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
              example:
                id: 8
                target: web1
                resource: "user:deploy"
                status: open
                risk: reversible
                opened_at: "2026-11-10T09:12:40Z"
                updated_at: "2026-11-10T09:13:02Z"
                changes:
                  - { attr: shell, from: /bin/sh, to: /bin/bash, risk: reversible }
                  - attr: ssh_keys
                    from: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm me@laptop", "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIXx other@host"]
                    to: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm me@laptop"]
                    risk: reversible
                actions: [accept, revert]
                plan_id: null
                resolution: null
                comments:
                  - id: 2
                    author: "token:tok_claude"
                    body: The shell change came from a manual chsh. Revert is safe.
                    created_at: "2026-11-10T09:13:02Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /issues/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [issues]
      operationId: resolveIssue
      summary: Resolve an issue
      description: |
        `accept` and `revert` create a Plan; the issue is `resolving` until its Run succeeds.
        `accept` is not offered for a sensitive change. Allowed actions are in `Issue.actions`;
        the list does not depend on the caller.

        `ignore_rule` creates a Plan that puts one `Rule` (origin `ignore_rule`, D-092). `rule`
        in the request sets its scope. Only a human session approves this Plan (D-099). The
        issue resolves as `ignore` when the revision commits.

        `ignore_once` answers 200 with the resolved Issue and makes no Plan (D-091). A later
        report with equal changes opens no Issue, until the resource reports no drift or a Run
        applies it. Who may call it: a human session; an `apply` token when every change of the
        Issue has a risk up to its `max_risk` and none is sensitive. Every other token gets 403
        `human-required` or `risk-too-high`.
      security:
        - session: []
        - token: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
            example: { action: revert, reason: Undo the manual edit. }
      responses:
        # T-025 question 3 (open): who may use `ignore_once`. The rule is in the description
        # above and in D-091. Another answer changes only that text.
        "200":
          description: The resolved Issue, for `ignore_once`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
              example:
                id: 7
                target: web1
                resource: "file:/etc/motd"
                status: resolved
                risk: reversible
                opened_at: "2026-11-10T09:10:12Z"
                updated_at: "2026-11-10T09:16:00Z"
                changes:
                  - { attr: content, from: "Hand-edited\n", to: "Hello from Plumb\n", risk: reversible }
                actions: []
                plan_id: null
                resolution: { action: ignore, by: "user:admin", at: "2026-11-10T09:16:00Z" }
                comments: []
        "201":
          description: The Plan that resolves the issue, for `accept`, `revert` and `ignore_rule`.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
              example:
                id: 15
                origin: revert
                issue_id: 7
                status: pending
                risk: reversible
                reason: Undo the manual edit.
                author: "user:admin"
                created_at: "2026-11-10T09:15:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                targets:
                  - target: web1
                    resources:
                      - resource: "file:/etc/motd"
                        action: update
                        risk: reversible
                        changes:
                          - { attr: content, from: "Hand-edited\n", to: "Hello from Plumb\n", risk: reversible }
                warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /issues/{id}/comments:
    parameters:
