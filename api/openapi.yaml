                rollback_to: 6
                issue_id: null
                status: pending
                risk: reversible
                reason: The MOTD change was wrong.
                author: "user:admin"
                created_at: "2026-11-10T09:20:00Z"
                base_revision: 7
                approved_by: null
                approved_at: null
                revision: null
                run_id: null
                human_only: []
                targets:
                  - target: web1
                    secrets: []
                    resources: []
                warnings:
                  - "file:/etc/motd on web1 is no longer managed. Plumb does not delete it on the guest."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
