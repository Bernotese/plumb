kind: Block
name: firewall
spec:
  title: Firewall
  description: >-
    An input firewall with nftables: it accepts SSH and the ports you list,
    and drops all other incoming traffic. Outgoing traffic is not filtered.
    The SSH port always stays open, also when the port lists are empty. Plumb
    keeps working: its agent connects out to Plumb. A change is applied
    safely: when the agent cannot reach Plumb within 90 seconds after the
    change, it puts the old rules back. Use this Block once per Target: a
    Target has one firewall. Ports that Docker publishes go around this
    firewall; with Docker, also list the ports of the guest's own services
    that containers use. Works on VM and container Targets.
  params:
    type: object
    properties:
      tcp_ports:
        type: string
        title: TCP ports
        description: >-
          TCP ports to accept, comma separated, ranges as a-b. Example:
          80,443,8000-8100. Empty: only SSH.
        pattern: "^$|^([0-9]{1,5}(-[0-9]{1,5})?)(,[0-9]{1,5}(-[0-9]{1,5})?)*$"
        maxLength: 1024
        default: ""
      udp_ports:
        type: string
        title: UDP ports
        description: "UDP ports to accept, in the same form. Empty: none."
        pattern: "^$|^([0-9]{1,5}(-[0-9]{1,5})?)(,[0-9]{1,5}(-[0-9]{1,5})?)*$"
        maxLength: 1024
        default: ""
      sources:
        type: string
        title: Allowed sources for the ports
        description: >-
          Networks that may use the TCP and UDP ports, comma separated CIDRs.
          Example: 192.168.1.0/24. Empty: from everywhere.
        pattern: "^$|^[0-9a-fA-F:.]+/[0-9]{1,3}(,[0-9a-fA-F:.]+/[0-9]{1,3})*$"
        maxLength: 4096
        default: ""
      ssh_port:
        type: string
        title: SSH port
        description: >-
          The port of sshd. It is always open. If another Block moves sshd to
          another port, set the same port here, or SSH is closed.
        pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
        default: "22"
      ssh_sources:
        type: string
        title: Allowed sources for SSH
        description: >-
          Networks that may use SSH, comma separated CIDRs. Empty: from
          everywhere.
        pattern: "^$|^[0-9a-fA-F:.]+/[0-9]{1,3}(,[0-9a-fA-F:.]+/[0-9]{1,3})*$"
        maxLength: 4096
        default: ""
  resources:
    # nft must exist before the agent writes the table.
    - package:
        name: nftables
    - firewall:
        name: main
        policy: drop
        tcp_ports: "{{ .tcp_ports }}"
        udp_ports: "{{ .udp_ports }}"
        sources: "{{ .sources }}"
        ssh_port: "{{ .ssh_port }}"
        ssh_sources: "{{ .ssh_sources }}"
